<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.181.1/build/three.module.js';

const sphere = new THREE.SphereGeometry(1, 40, 28);
const glass = (color) => new THREE.MeshPhysicalMaterial({ color, roughness: 0.04, transmission: 1, thickness: 1.2, ior: 1.45, clearcoat: 1 });
const frost = (color) => new THREE.MeshPhysicalMaterial({ color, roughness: 0.45, transmission: 0.5, thickness: 0.4 });
const ink = new THREE.MeshStandardMaterial({ color: 0x2b1b1b, roughness: 0.3 });
const solid = (color) => new THREE.MeshStandardMaterial({ color, roughness: 0.35 });
const ellipsoid = (w, h, d, material, x = 0, y = 0, z = 0, rz = 0) => {
  const mesh = new THREE.Mesh(sphere, material);
  mesh.scale.set(w, h, d); mesh.position.set(x, y, z); mesh.rotation.z = rz;
  return mesh;
};
const surface = (w, h, d, x, y) => d * Math.sqrt(Math.max(0, 1 - (x / w) ** 2 - (y / h) ** 2));
const cone = (radius, height, material, x, y, z, rz) => {
  const mesh = new THREE.Mesh(new THREE.ConeGeometry(radius, height, 4), material);
  mesh.rotation.y = Math.PI / 4; mesh.scale.z = 0.45;
  const group = new THREE.Group(); group.add(mesh); group.position.set(x, y, z); group.rotation.z = rz;
  return group;
};
const model = new THREE.Group();
const deletedParts = /* PART_DELETIONS_BEGIN */
[
  "무늬 오른쪽",
  "무늬 가운데",
  "늑대 파츠 20",
  "늑대 파츠 19",
  "늑대 파츠 13",
  "늑대 파츠 12",
  "코",
  "늑대 파츠 16",
  "늑대 파츠 18",
  "늑대 파츠 17"
]
/* PART_DELETIONS_END */;
const partEdits = /* PART_EDITS_BEGIN */

    ],

const fur = solid(0x87919b);
const furLight = solid(0xc5cbd0);
const furDark = solid(0x4b535d);
const innerEar = solid(0xc77f83);
const eyeMat = solid(0x20252c);
const noseMat = solid(0x252a30);
const muzzleMat = solid(0xe0e2e3);

// Broad, slightly angular wolf head and lower cheeks.
model.add(ellipsoid(1.08, 0.92, 0.82, fur, 0, 0, 0));
model.add(ellipsoid(0.72, 0.48, 0.68, furLight, 0, -0.43, 0.26));
// Pointed ears, set wide apart and angled outward.
for (const side of [-1, 1]) {
  const ear = cone(0.43, 0.95, fur, side * 0.69, 0.86, -0.02, -side * 0.22);
  ear.scale.set(1.0, 1.0, 0.85);
  model.add(ear);
  const inner = cone(0.23, 0.60, innerEar, side * 0.69, 0.87, 0.12, -side * 0.22);
  inner.scale.set(0.9, 1.0, 0.55);
  model.add(inner);
}
// Forehead tufts create a more wolf-like silhouette.
model.add(cone(0.29, 0.52, furLight, -0.22, 0.83, 0.35, -0.20));
model.add(cone(0.29, 0.52, furLight,  0.22, 0.83, 0.35,  0.20));
// Tapered muzzle: overlapping ellipsoids lead to a dark nose at the tip.
model.add(ellipsoid(0.43, 0.30, 0.58, muzzleMat, 0, -0.22, 0.67, Math.PI * 0.02));
model.add(ellipsoid(0.20, 0.16, 0.24, noseMat, 0, -0.14, 1.14));
// Mouth line and two small lower muzzle marks.
model.add(ellipsoid(0.025, 0.16, 0.025, furDark, 0, -0.40, 1.00));
for (const side of [-1, 1]) {
  model.add(ellipsoid(0.13, 0.09, 0.04, furLight, side * 0.17, -0.27, 1.02));
}
// Dark, narrow eyes set slightly toward the sides of the face.
for (const side of [-1, 1]) {
  const eye = new THREE.Group();
  eye.add(ellipsoid(0.13, 0.075, 0.055, eyeMat, 0, 0, 0));
  eye.position.set(side * 0.43, 0.04, 0.70);
  eye.rotation.z = -side * 0.16;
  model.add(eye);
}
// Three pale forehead markings and subtle cheek tufts.
for (const x of [-0.22, 0, 0.22]) {
  model.add(ellipsoid(0.075, 0.23, 0.035, furLight, x, 0.47, 0.70, x * 0.45));
}
for (const side of [-1, 1]) {
  model.add(cone(0.19, 0.34, furLight, side * 0.72, -0.35, 0.37, -side * 0.65));
}
const componentNames = [
  '머리', '왼쪽 귀', '왼쪽 귀 안쪽', '오른쪽 귀', '오른쪽 귀 안쪽',
  '무늬 왼쪽', '무늬 가운데', '무늬 오른쪽', '왼쪽 눈', '오른쪽 눈', '코'
];
model.children.forEach((child, index) => { child.name = componentNames[index] || `늑대 파츠 ${index + 1}`; });
for (const name of deletedParts) {
  const child = model.getObjectByName(name);
  if (child?.parent === model) model.remove(child);
  delete partEdits[name];
}
for (const side of [-1, 1]) {
  const eyebrow = ellipsoid(0.15, 0.03, 0.04, eyeMat, side * 0.43, 0.25, 0.75, side * 0.12);
  eyebrow.name = side < 0 ? '왼쪽 눈썹' : '오른쪽 눈썹';
  model.add(eyebrow);
}
model.updateMatrixWorld(true);
parent.postMessage({ type: 'lightstick-part', file: window.__PART_FILE || window.name || new URLSearchParams(location.search).get('partFile') || location.pathname.split('/').pop(), object: model.toJSON(), edits: partEdits }, '*');
</script>
