const ink = new THREE.MeshStandardMaterial({ color: 0x2b1b1b, roughness: 0.3 });
const ellipsoid = (w, h, d, material, x = 0, y = 0, z = 0, rz = 0) => {
  const mesh = new THREE.Mesh(sphere, material);
  mesh.scale.set(w, h, d); mesh.position.set(x, y, z); mesh.rotation.z = rz;
  return mesh;
};

const headRadius = 0.9;
const headGroup = new THREE.Group();
const headMaterial = glass(0xffffff);
const headCylinder = new THREE.Mesh(new THREE.CylinderGeometry(headRadius, headRadius, 1.2, 40), headMaterial);
headCylinder.position.y = -0.45;
headGroup.add(headCylinder);
const headDome = new THREE.Mesh(new THREE.SphereGeometry(headRadius, 40, 24, 0, Math.PI * 2, 0, Math.PI / 2), headMaterial);
headDome.position.y = 0.15;
headGroup.add(headDome);
model.add(headGroup);
const featherColors = [0xd9dfe6, 0xe3e8ed, 0xebeff3, 0xf2f4f6, 0xebeff3, 0xe3e8ed, 0xd9dfe6];
for (let i = 0; i < 7; i++) {
  const feather = ellipsoid(0.32, 0.55, 0.12, new THREE.MeshStandardMaterial({ color: featherColors[i], roughness: 0.42 }));
  const angle = (i / 7) * Math.PI * 2;
  const radius = 0.84;
  feather.position.set(Math.sin(angle) * radius, -0.82, Math.cos(angle) * radius);
  feather.rotation.y = angle;
  model.add(feather);
}
for (const side of [-1, 1]) {
  const x = side * 0.45, y = 0.12, eye = new THREE.Group();
  eye.add(ellipsoid(0.15, 0.105, 0.06, ink));
  eye.position.set(x, y, Math.max(0.15, surface(1, 1.2, 0.9, x, y) * 0.88)); eye.scale.setScalar(1.8); model.add(eye);
}

model.children.forEach((child, index) => { child.name = componentNames[index]; });
