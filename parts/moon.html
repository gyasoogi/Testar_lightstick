<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>박문대 파트</title>
</head>
<body>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.181.1/build/three.module.js';

const sphere = new THREE.SphereGeometry(1, 40, 28);
const glass = (color) => new THREE.MeshPhysicalMaterial({ color, roughness: 0.04, transmission: 1, thickness: 1.2, ior: 1.45, clearcoat: 1 });
const ink = new THREE.MeshStandardMaterial({ color: 0x2b1b1b, roughness: 0.3 });
const ellipsoid = (w, h, d, material, x = 0, y = 0, z = 0, rz = 0) => {
  const mesh = new THREE.Mesh(sphere, material);
  mesh.scale.set(w, h, d); mesh.position.set(x, y, z); mesh.rotation.z = rz;
  return mesh;
};
const surface = (w, h, d, x, y) => d * Math.sqrt(Math.max(0, 1 - (x / w) ** 2 - (y / h) ** 2));
const model = new THREE.Group();
const deletedParts = /* PART_DELETIONS_BEGIN */
[
  "코"
]
/* PART_DELETIONS_END */;
const partEdits = /* PART_EDITS_BEGIN */
{
  "왼쪽 귀": {
    "position": [
      0.2,
      0.13,
      0
    ],
    "size": 0.9,
    "axisScale": [
      1.31,
      0.94,
      2.5
    ],
    "rotation": [
      0,
      0,
      -45
    ],
    "visible": true
  },
  "오른쪽 귀": {
    "position": [
      -0.2,
      0.13,
      0
    ],
    "size": 0.9,
    "axisScale": [
      1.31,
      0.94,
      2.5
    ],
    "rotation": [
      0,
      0,
      45
    ],
    "visible": true
  },
  "오른쪽 눈": {
    "position": [
      -0.04,
      0,
      0.02
    ],
    "size": 1,
    "axisScale": [
      1,
      1,
      1
    ],
    "rotation": [
      0,
      0,
      0
    ],
    "visible": true
  },
  "왼쪽 눈": {
    "position": [
      0.04,
      0,
      0.02
    ],
    "size": 1,
    "axisScale": [
      1,
      1,
      1
    ],
    "rotation": [
      0,
      0,
      0
    ],
    "visible": true
  },
  "왼쪽 눈썹": {
    "position": [
      -0.1,
      -0.09,
      -0.01
    ],
    "size": 2.06,
    "axisScale": [
      1,
      1,
      1
    ],
    "rotation": [
      0,
      -16,
      11
    ],
    "visible": true
  },
  "오른쪽 눈썹": {
    "position": [
      0.1,
      -0.09,
      -0.01
    ],
    "size": 2.06,
    "axisScale": [
      1,
      1,
      1
    ],
    "rotation": [
      0,
      16,
      -11
    ],
    "visible": true
  }
}
/* PART_EDITS_END */;
model.add(ellipsoid(1.05, 0.95, 0.9, glass(0xf7e5b8)));
for (const side of [-1, 1]) model.add(ellipsoid(0.4, 0.75, 0.16, glass(0xf0cd8a), side, 0.15, 0.05, side * 0.15));
for (const side of [-1, 1]) {
  const x = side * 0.42, y = -0.05, eye = new THREE.Group();
  eye.add(ellipsoid(0.15, 0.105, 0.06, ink));
  eye.position.set(x, y, Math.max(0.15, surface(1.05, 0.95, 0.9, x, y) * 0.88)); eye.scale.setScalar(1.8); model.add(eye);
}
model.add(ellipsoid(0.05, 0.035, 0.04, ink, 0, -0.28, surface(1.05, 0.95, 0.9, 0, -0.28) * 0.9));
const componentNames = ['머리', '왼쪽 귀', '오른쪽 귀', '왼쪽 눈', '오른쪽 눈', '코'];
model.children.forEach((child, index) => { child.name = componentNames[index]; });
for (const name of deletedParts) {
  const child = model.getObjectByName(name);
  if (child?.parent === model) model.remove(child);
  delete partEdits[name];
}
for (const side of [-1, 1]) {
  const x = side * 0.42, y = 0.15;
  const eyebrow = ellipsoid(0.12, 0.025, 0.035, ink, x, y, surface(1.05, 0.95, 0.9, x, y) * 0.88 + 0.04, side * 0.12);
  eyebrow.name = side < 0 ? '왼쪽 눈썹' : '오른쪽 눈썹';
  model.add(eyebrow);
}
model.updateMatrixWorld(true);
parent.postMessage({ type: 'lightstick-part', file: window.__PART_FILE || window.name || new URLSearchParams(location.search).get('partFile') || location.pathname.split('/').pop(), object: model.toJSON(), edits: partEdits }, '*');
</script>
</body>
</html>
