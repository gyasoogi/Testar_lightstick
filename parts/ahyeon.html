<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>선아현 파트</title>
</head>
<body>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.181.1/build/three.module.js';

const sphere = new THREE.SphereGeometry(1, 40, 28);
const glass = (color) => new THREE.MeshPhysicalMaterial({ color, roughness: 0.04, transmission: 1, thickness: 1.2, ior: 1.45, clearcoat: 1 });
const frost = (color) => new THREE.MeshPhysicalMaterial({ color, roughness: 0.45, transmission: 0.5, thickness: 0.4 });
const ink = new THREE.MeshStandardMaterial({ color: 0x2b1b1b, roughness: 0.3 });
const solid = (color) => new THREE.MeshStandardMaterial({ color, roughness: 0.35 });
const ellipsoid = (w, h, d, material, x = 0, y = 0, z = 0, rz = 0) => {
  const mesh = new THREE.Mesh(sphere, material);
  mesh.scale.set(w, h, d); mesh.position.set(x, y, z); mesh.rotation.z = rz;
  return mesh;
};
const surface = (w, h, d, x, y) => d * Math.sqrt(Math.max(0, 1 - (x / w) ** 2 - (y / h) ** 2));
const model = new THREE.Group();
const partEdits = /* PART_EDITS_BEGIN */
{
  "주둥이": {
    "position": [
      0,
      0,
      0
    ],
    "size": 1,
    "axisScale": [
      1,
      1,
      1
    ],
    "rotation": [
      0,
      0,
      0
    ],
    "visible": false
  },
  "코": {
    "position": [
      0,
      0,
      0
    ],
    "size": 1,
    "axisScale": [
      1,
      1,
      1
    ],
    "rotation": [
      0,
      0,
      0
    ],
    "visible": false
  },
  "무늬 2": {
    "position": [
      0,
      0,
      0.03
    ],
    "size": 1,
    "axisScale": [
      1,
      1,
      1
    ],
    "rotation": [
      0,
      0,
      0
    ],
    "visible": true
  },
  "무늬 3": {
    "position": [
      0,
      0,
      0.03
    ],
    "size": 1,
    "axisScale": [
      1,
      1,
      1
    ],
    "rotation": [
      0,
      0,
      0
    ],
    "visible": true
  },
  "무늬 1": {
    "position": [
      0,
      0,
      0.01
    ],
    "size": 1,
    "axisScale": [
      1,
      1,
      1
    ],
    "rotation": [
      0,
      0,
      0
    ],
    "visible": true
  },
  "무늬 4": {
    "position": [
      0,
      0.04,
      0.03
    ],
    "size": 1,
    "axisScale": [
      1,
      1,
      1
    ],
    "rotation": [
      0,
      0,
      0
    ],
    "visible": true
  },
  "왼쪽 뿔": {
    "position": [
      0,
      0,
      0
    ],
    "size": 1,
    "axisScale": [
      1,
      1,
      1
    ],
    "rotation": [
      0,
      0,
      0
    ],
    "visible": true
  }
}
/* PART_EDITS_END */;
model.add(ellipsoid(1.1, 0.95, 0.9, glass(0xe3a770)));
for (const side of [-1, 1]) {
  model.add(ellipsoid(0.48, 0.3, 0.1, glass(0xe3a770), side, 0.55, 0, side * 0.7));
  model.add(ellipsoid(0.3, 0.17, 0.07, frost(0xffd6d6), side, 0.55, 0.07, side * 0.7));
  const antler = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.06, 0.55, 10), solid(0x8a5a3c));
  antler.position.set(side * 0.5, 1.05, 0); antler.rotation.z = -side * 0.25; model.add(antler);
}
for (const [x, y] of [[0, 0.65], [-0.25, 0.45], [0.25, 0.45], [0, 0.3]]) model.add(ellipsoid(0.07, 0.07, 0.05, frost(0xffffff), x, y, surface(1.1, 0.95, 0.9, x, y) * 0.92));
model.add(ellipsoid(0.7, 0.45, 0.55, frost(0xfff1d8), 0, -0.4, 0.35));
const faceY = -0.02;
for (const side of [-1, 1]) {
  const x = side * 0.45;
  const eye = new THREE.Group();
  eye.add(ellipsoid(0.15, 0.105, 0.06, ink));
  eye.position.set(x, faceY, Math.max(0.15, surface(1.1, 0.95, 0.9, x, faceY) * 0.88));
  eye.scale.setScalar(1.8); model.add(eye);
}
model.add(ellipsoid(0.05, 0.035, 0.04, ink, 0, -0.45, surface(1.1, 0.95, 0.9, 0, -0.45) * 0.9));
const componentNames = ['머리', '왼쪽 귀', '왼쪽 귀 안쪽', '왼쪽 뿔', '오른쪽 귀', '오른쪽 귀 안쪽', '오른쪽 뿔', '무늬 1', '무늬 2', '무늬 3', '무늬 4', '주둥이', '왼쪽 눈', '오른쪽 눈', '코'];
model.children.forEach((child, index) => { child.name = componentNames[index]; });
model.updateMatrixWorld(true);
parent.postMessage({ type: 'lightstick-part', file: window.__PART_FILE || window.name || new URLSearchParams(location.search).get('partFile') || location.pathname.split('/').pop(), object: model.toJSON(), edits: partEdits }, '*');
</script>
</body>
</html>
