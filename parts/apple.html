<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>사과 파트</title>
</head>
<body>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.181.1/build/three.module.js';

const sphere = new THREE.SphereGeometry(1, 40, 28);
const glass = (color, options = {}) => new THREE.MeshPhysicalMaterial({
  color, roughness: 0.04, transmission: 1, thickness: 1.2, ior: 1.45,
  clearcoat: 1, clearcoatRoughness: 0.03, ...options
});
const solid = (color) => new THREE.MeshStandardMaterial({ color, roughness: 0.35 });
const ellipsoid = (width, height, depth, material, x = 0, y = 0, z = 0, rz = 0) => {
  const mesh = new THREE.Mesh(sphere, material);
  mesh.scale.set(width, height, depth);
  mesh.position.set(x, y, z);
  mesh.rotation.z = rz;
  return mesh;
};

const model = new THREE.Group();
const partEdits = /* PART_EDITS_BEGIN */ {} /* PART_EDITS_END */;
model.add(ellipsoid(1.15, 1, 1.1, glass(0xff4535)));
model.add(ellipsoid(0.16, 0.1, 0.05, new THREE.MeshBasicMaterial({ color: 0xffffff }), -0.55, 0.45, 0.92, 0.5));
const stem = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.05, 0.35, 10), solid(0x7a4a2a));
stem.position.set(0, 1.05, 0);
stem.rotation.z = 0.15;
model.add(stem);
model.add(ellipsoid(0.35, 0.15, 0.1, glass(0x59b34a, { transmission: 0.99 }), 0.3, 1.08, 0, 0.5));
const componentNames = ['과육', '하이라이트', '줄기', '잎'];
model.children.forEach((child, index) => { child.name = componentNames[index]; });
model.updateMatrixWorld(true);
parent.postMessage({ type: 'lightstick-part', file: window.__PART_FILE || window.name || new URLSearchParams(location.search).get('partFile') || location.pathname.split('/').pop(), object: model.toJSON(), edits: partEdits }, '*');
</script>
</body>
</html>
