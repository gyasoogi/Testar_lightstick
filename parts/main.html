<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Three.js Lightstick Prototype</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 30%, #f8fbff 0%, #e8edf5 38%, #cfd6e2 100%);
      font-family: Arial, sans-serif;
    }
    #app {
      width: 100%;
      height: 100%;
    }
    .ui {
      position: fixed;
      left: 18px;
      bottom: 18px;
      z-index: 5;
      padding: 12px 14px;
      border-radius: 14px;
      background: rgba(255,255,255,.72);
      backdrop-filter: blur(12px);
      box-shadow: 0 10px 30px rgba(30,45,70,.12);
      color: #263244;
      font-size: 13px;
      line-height: 1.55;
      user-select: none;
    }
    .ui b { font-size: 14px; }
    .ui button {
      margin-top: 8px;
      padding: 7px 11px;
      border: 0;
      border-radius: 999px;
      background: #222836;
      color: white;
      cursor: pointer;
      font-weight: 700;
    }

    .part-panel {
      position: fixed;
      top: 18px;
      right: 18px;
      width: min(250px, calc(100vw - 36px));
      max-height: calc(100vh - 36px);
      overflow: auto;
      z-index: 10;
      padding: 12px;
      border-radius: 10px;
      background: rgba(255,255,255,.8);
      backdrop-filter: blur(12px);
      box-shadow: 0 12px 28px rgba(30,45,70,.12);
      color: #1f2736;
      font-size: 12px;
    }
    .part-panel h3 {
      margin: 0 0 12px;
      font-size: 13px;
      letter-spacing: .04em;
      text-transform: uppercase;
      color: #384159;
    }
    .part-slot {
      margin-bottom: 6px;
      padding: 6px 0;
      border-bottom: 1px solid rgba(40, 52, 70, 0.12);
    }
    .part-slot-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 4px;
      font-weight: 700;
    }
    .part-control-label {
      display: block;
      margin-top: 4px;
    }
    .part-slot select {
      width: 100%;
      margin: 0 0 4px;
      padding: 7px 9px;
      border: 1px solid rgba(30,45,70,.18);
      border-radius: 9px;
      background: white;
      color: #1f2736;
      font-size: 12px;
    }
    .part-slot input[type="range"] {
      width: 100%;
      accent-color: #2d6df6;
      display: block;
    }
  </style>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.181.1/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.181.1/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="app"></div>

  <div class="ui">
    드래그: 회전 · 휠: 확대/축소<br/>
    버튼 클릭: 조명 ON/OFF<br/>
    <button id="toggle">LIGHT ON</button>
  </div>

  <div class="part-panel" id="partPanel">
    <h3>파트 커스터마이저</h3>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

    const container = document.getElementById('app');

    const scene = new THREE.Scene();
    scene.background = null;

    const camera = new THREE.PerspectiveCamera(34, innerWidth / innerHeight, 0.1, 100);
    camera.position.set(5.4, 4.1, 8.6);
    camera.lookAt(0, 1.15, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 0.7;
    renderer.localClippingEnabled = true;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    container.appendChild(renderer.domElement);

    const environmentGenerator = new THREE.PMREMGenerator(renderer);
    scene.environment = environmentGenerator.fromScene(new RoomEnvironment(), 0.04).texture;
    environmentGenerator.dispose();

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.target.set(0, 1.0, 0);
    controls.minDistance = 5.2;
    controls.maxDistance = 15;
    controls.maxPolarAngle = Math.PI * 0.82;

    // ---------- Lighting ----------
    scene.add(new THREE.HemisphereLight(0xffffff, 0x9ba6b6, 0.7));

    const key = new THREE.DirectionalLight(0xffffff, 1.2);
    key.position.set(4, 7, 6);
    key.castShadow = true;
    key.shadow.mapSize.set(2048, 2048);
    scene.add(key);

    const rim = new THREE.PointLight(0xcce8ff, 0.45, 20);
    rim.position.set(-4, 5, -2);
    scene.add(rim);

    const warm = new THREE.PointLight(0xffdcc5, 0.4, 14);
    warm.position.set(3, 1, 3);
    scene.add(warm);

    // ---------- Materials ----------
    const whiteMat = new THREE.MeshPhysicalMaterial({
      color: 0xf5f6f8,
      roughness: 0.32,
      metalness: 0.08,
      clearcoat: 0.35,
      clearcoatRoughness: 0.18
    });

    const darkMat = new THREE.MeshStandardMaterial({
      color: 0x24262c,
      roughness: 0.28,
      metalness: 0.65
    });

    const glassMat = new THREE.MeshPhysicalMaterial({
      color: 0xf9fcff,
      transmission: 0.9,
      transparent: true,
      opacity: 0.28,
      roughness: 0.08,
      thickness: 0.45,
      ior: 1.45,
      side: THREE.DoubleSide,
      depthWrite: false
    });

    const creamMat = new THREE.MeshStandardMaterial({
      color: 0xffe9ad,
      roughness: 0.65,
      metalness: 0.0
    });

    const crystalMat = new THREE.MeshPhysicalMaterial({
      color: 0xf5f1ff,
      transmission: 0.58,
      transparent: true,
      opacity: 0.68,
      roughness: 0.03,
      metalness: 0.08,
      emissive: 0x9aabff,
      emissiveIntensity: 0,
      clearcoat: 1,
      clearcoatRoughness: 0.03,
      ior: 1.62,
      thickness: 1.0
    });

    const glowCanvas = document.createElement('canvas');
    glowCanvas.width = 128;
    glowCanvas.height = 128;
    const glowContext = glowCanvas.getContext('2d');
    if (!glowContext) throw new Error('보석 후광 텍스처를 만들 수 없습니다.');
    const glowGradient = glowContext.createRadialGradient(64, 64, 0, 64, 64, 64);
    glowGradient.addColorStop(0, 'rgba(190, 205, 255, 0.22)');
    glowGradient.addColorStop(0.32, 'rgba(160, 180, 255, 0.42)');
    glowGradient.addColorStop(0.65, 'rgba(145, 165, 255, 0.2)');
    glowGradient.addColorStop(1, 'rgba(130, 155, 255, 0)');
    glowContext.fillStyle = glowGradient;
    glowContext.fillRect(0, 0, 128, 128);
    const crystalAuraMat = new THREE.SpriteMaterial({
      map: new THREE.CanvasTexture(glowCanvas),
      color: 0xaebfff,
      transparent: true,
      opacity: 0,
      blending: THREE.AdditiveBlending,
      depthWrite: false
    });

    // ---------- Helpers ----------
    function mesh(geometry, material, {x=0,y=0,z=0, rx=0,ry=0,rz=0, sx=1,sy=1,sz=1}={}) {
      const m = new THREE.Mesh(geometry, material);
      m.position.set(x,y,z);
      m.rotation.set(rx,ry,rz);
      m.scale.set(sx,sy,sz);
      m.castShadow = true;
      m.receiveShadow = true;
      return m;
    }

    function torus(r, tube, y, scaleY=1, mat=whiteMat) {
      const t = mesh(new THREE.TorusGeometry(r, tube, 18, 64), mat, {y, rx: Math.PI/2});
      t.scale.y = scaleY;
      return t;
    }

    // ---------- Root ----------
    const lightstick = new THREE.Group();
    lightstick.position.y = -1.0;
    scene.add(lightstick);

    // ---------- Handle / Base ----------
    const handle = new THREE.Group();
    lightstick.add(handle);

    // Main lower grip
    handle.add(mesh(new THREE.CylinderGeometry(0.53, 0.42, 2.35, 64), whiteMat, {y:-1.88}));

    // slight upper neck
    handle.add(mesh(new THREE.CylinderGeometry(0.40, 0.48, 0.30, 64), whiteMat, {y:-0.61}));

    // base rim
    handle.add(mesh(new THREE.CylinderGeometry(0.68, 0.58, 0.38, 64), whiteMat, {y:-2.98}));
    handle.add(torus(0.56, 0.055, -2.86));
    handle.add(torus(0.49, 0.035, -1.0));

    // Button bezel + button
    const bezel = mesh(new THREE.CylinderGeometry(0.19, 0.19, 0.07, 40), whiteMat, {y:-2.15, z:0.49, rx:Math.PI/2});
    handle.add(bezel);

    const buttonMat = new THREE.MeshPhysicalMaterial({
      color: 0xf4f6f8,
      roughness: 0.22,
      metalness: 0.05,
      clearcoat: 0.8
    });
    const button = mesh(new THREE.CylinderGeometry(0.135, 0.135, 0.08, 40), buttonMat, {y:-2.15, z:0.535, rx:Math.PI/2});
    button.name = 'button';
    handle.add(button);

    // ---------- Middle transparent chamber ----------
    const chamber = new THREE.Group();
    lightstick.add(chamber);

    // transparent tube
    const chamberGlassMat = glassMat.clone();
    chamberGlassMat.envMapIntensity = 0;
    chamberGlassMat.reflectivity = 0;
    chamberGlassMat.roughness = 1;
    const chamberGlass = mesh(new THREE.CylinderGeometry(0.47,0.47,2.02,64,1,true), chamberGlassMat, {y:0.52});
    chamber.add(chamberGlass);

    // top and bottom trim
    chamber.add(mesh(new THREE.CylinderGeometry(0.53,0.53,0.15,64), whiteMat, {y:-0.53}));
    chamber.add(mesh(new THREE.CylinderGeometry(0.54,0.54,0.15,64), whiteMat, {y:1.57}));

    // 내부 받침은 낮게 유지해서 사과 하단과 닿지 않게 함
    const innerSupport = mesh(new THREE.ConeGeometry(0.22, 0.26, 3), whiteMat, {y:-0.18, rz:0.0});
    innerSupport.rotation.y = Math.PI / 4;
    chamber.add(innerSupport);

    // ---------- Custom part slots ----------
    const partOptions = [
      { label: '사과', value: 'parts/apple.html' },
      { label: '선아현', value: 'parts/ahyeon.html' },
      { label: '배세진', value: 'parts/bea.html' },
      { label: '차유진', value: 'parts/cha.html' },
      { label: '김래빈', value: 'parts/kim.html' },
      { label: '박문대', value: 'parts/moon.html' },
      { label: '류청우', value: 'parts/ryu.html' },
      { label: '이세진', value: 'parts/sejin.html' }
    ];

    function applyPartEdits(model, edits = {}) {
      for (const child of model.children) {
        const edit = edits[child.name];
        if (!edit) continue;
        const position = edit.position || [0, 0, 0];
        const rotation = edit.rotation || [0, 0, 0];
        const axisScale = edit.axisScale || [1, 1, 1];
        child.position.add(new THREE.Vector3(...position));
        child.rotation.x += THREE.MathUtils.degToRad(rotation[0] || 0);
        child.rotation.y += THREE.MathUtils.degToRad(rotation[1] || 0);
        child.rotation.z += THREE.MathUtils.degToRad(rotation[2] || 0);
        child.scale.multiplyScalar(edit.size ?? 1);
        child.scale.multiply(new THREE.Vector3(...axisScale));
        child.visible = edit.visible !== false;
        if (edit.color) {
          const materials = Array.isArray(child.material) ? child.material : [child.material];
          materials.forEach((material) => material.color?.set(edit.color));
        }
      }
    }

    function applyFeatherClipping(model, clipping, enabled) {
      if (!clipping) return;
      for (const child of model.children) {
        if (!child.name.startsWith('깃털')) continue;
        const materials = Array.isArray(child.material) ? child.material : [child.material];
        materials.forEach((material) => {
          const state = material.userData.cylinderClip ||= {
            enabled,
            radius: clipping.cylinderRadius,
            rootInverse: new THREE.Matrix4(),
            shader: null
          };
          state.enabled = enabled;
          state.radius = clipping.cylinderRadius;
          if (!state.shader) {
            material.onBeforeCompile = (shader) => {
              shader.uniforms.uCylinderRootInverse = { value: state.rootInverse };
              shader.uniforms.uCylinderClipEnabled = { value: state.enabled };
              shader.uniforms.uCylinderClipRadius = { value: state.radius };
              shader.vertexShader = shader.vertexShader
                .replace('#include <common>', '#include <common>\nuniform mat4 uCylinderRootInverse;\nvarying vec3 vCylinderLocalPosition;')
                .replace('#include <begin_vertex>', '#include <begin_vertex>\nvCylinderLocalPosition = (uCylinderRootInverse * modelMatrix * vec4(transformed, 1.0)).xyz;');
              shader.fragmentShader = shader.fragmentShader
                .replace('#include <common>', '#include <common>\nuniform bool uCylinderClipEnabled;\nuniform float uCylinderClipRadius;\nvarying vec3 vCylinderLocalPosition;')
                .replace('#include <opaque_fragment>', 'if (uCylinderClipEnabled && dot(vCylinderLocalPosition.xz, vCylinderLocalPosition.xz) > uCylinderClipRadius * uCylinderClipRadius) discard;\n#include <opaque_fragment>');
              state.shader = shader;
            };
            material.customProgramCacheKey = () => 'cylinder-edge-clip';
            material.needsUpdate = true;
          }
          if (state.shader) {
            state.shader.uniforms.uCylinderClipEnabled.value = enabled;
            state.shader.uniforms.uCylinderClipRadius.value = clipping.cylinderRadius;
          }
        });
        child.onBeforeRender = () => {
          model.updateWorldMatrix(true, false);
          const rootInverse = model.matrixWorld.clone().invert();
          const materials = Array.isArray(child.material) ? child.material : [child.material];
          materials.forEach((material) => {
            const state = material.userData.cylinderClip;
            if (state) state.rootInverse.copy(rootInverse);
          });
        };
      }
    }

    const slotConfigs = [
      { id: 'top', label: '상단', defaultFile: 'parts/apple.html', y: 1.02, scale: 0.72 },
      { id: 'middle', label: '중간', defaultFile: 'parts/ahyeon.html', y: 0.18, scale: 0.7 },
      { id: 'bottom', label: '하단', defaultFile: 'parts/kim.html', y: -0.42, scale: 0.72 }
    ];

    const partPanel = document.getElementById('partPanel');

    slotConfigs.forEach((config) => {
      const wrapper = document.createElement('div');
      wrapper.className = 'part-slot';

      const header = document.createElement('div');
      header.className = 'part-slot-header';
      header.innerHTML = `<span>${config.label}</span>`;

      const select = document.createElement('select');
      partOptions.forEach((item) => {
        const option = document.createElement('option');
        option.value = item.value;
        option.textContent = item.label;
        select.appendChild(option);
      });
      select.value = config.defaultFile;

      const range = document.createElement('input');
      range.type = 'range';
      range.min = '0.5';
      range.max = '1.8';
      range.step = '0.01';
      range.value = String(config.scale);
      range.setAttribute('aria-label', `${config.label} 파트 크기`);

      const sizeLabel = document.createElement('label');
      sizeLabel.className = 'part-control-label';
      sizeLabel.textContent = '크기';
      sizeLabel.appendChild(range);

      const positionRange = document.createElement('input');
      positionRange.type = 'range';
      positionRange.min = '-1.5';
      positionRange.max = '1.5';
      positionRange.step = '0.01';
      positionRange.value = '0';
      positionRange.setAttribute('aria-label', `${config.label} 파트 세로 위치`);

      const positionLabel = document.createElement('label');
      positionLabel.className = 'part-control-label';
      positionLabel.textContent = '세로 위치';
      positionLabel.appendChild(positionRange);

      const iframe = document.createElement('iframe');
      iframe.title = `${config.label} 파트`;
      iframe.hidden = true;

      wrapper.appendChild(header);
      wrapper.appendChild(select);
      wrapper.appendChild(sizeLabel);
      wrapper.appendChild(positionLabel);
      wrapper.appendChild(iframe);
      partPanel.appendChild(wrapper);

      const group = new THREE.Group();
      group.position.set(0, config.y, 0);
      chamber.add(group);

      let inSceneMesh = null;
      let inSceneModel = false;
      const removeCurrentMesh = () => {
        if (!inSceneMesh) return;
        group.remove(inSceneMesh);
        inSceneMesh.traverse((object) => {
          object.geometry?.dispose?.();
          const materials = Array.isArray(object.material) ? object.material : [object.material];
          materials.forEach((material) => material?.dispose?.());
        });
        inSceneMesh = null;
        inSceneModel = false;
      };
      const receivePartModel = (event) => {
        const currentFile = new URL(iframe.src).pathname.split('/').pop();
        if (event.source !== iframe.contentWindow || event.data?.type !== 'lightstick-part' || event.data.file !== currentFile) return;
        removeCurrentMesh();
        try {
          const model = new THREE.ObjectLoader().parse(event.data.object);
          applyPartEdits(model, event.data.edits);
          model.position.y = 0.18;
          model.scale.setScalar(Number(range.value) * 0.4);
          model.traverse((object) => {
            if (object.isMesh) {
              object.castShadow = true;
              object.receiveShadow = true;
              const materials = Array.isArray(object.material) ? object.material : [object.material];
              const visibleMaterials = materials.map((material) => {
                if (!material) return material;
                if ('roughness' in material) material.roughness = 0.16;
                if (material.isMeshPhysicalMaterial) {
                  material.clearcoat = 1;
                  material.clearcoatRoughness = 0.08;
                  material.transmission = 0;
                }
                material.transparent = false;
                material.opacity = 1;
                return material;
              });
              object.material = Array.isArray(object.material) ? visibleMaterials : visibleMaterials[0];
            }
          });
          applyFeatherClipping(model, event.data.clipping, event.data.edits?.__settings?.clipFeathers === true);
          group.add(model);
          inSceneMesh = model;
          inSceneModel = true;
        } catch (error) {
          console.error(`파트 모델을 불러오지 못했습니다: ${config.label}`, error);
        }
      };
      window.addEventListener('message', receivePartModel);

      select.addEventListener('change', () => {
        removeCurrentMesh();
        iframe.src = select.value;
      });

      range.addEventListener('input', () => {
        const value = Number(range.value);
        if (inSceneMesh) {
          inSceneMesh.scale.setScalar(inSceneModel ? value * 0.4 : value);
        }
        group.scale.setScalar(1);
      });

      positionRange.addEventListener('input', () => {
        group.position.y = config.y + Number(positionRange.value);
      });

      range.dispatchEvent(new Event('input'));
      iframe.src = config.defaultFile;
    });

    // ---------- Upper head base ----------
    const headGroup = new THREE.Group();
    headGroup.position.y = 1.92;
    lightstick.add(headGroup);

    headGroup.add(mesh(new THREE.CylinderGeometry(0.58,0.48,0.22,64), whiteMat, {y:-0.36}));
    headGroup.add(torus(0.54,0.055,-0.22));

    // ---------- Crystal ----------
    const crystal = mesh(new THREE.OctahedronGeometry(0.62,0), crystalMat, {y:0.48, sy:1.1, sx:1.08});
    crystal.rotation.y = Math.PI/4;
    headGroup.add(crystal);

    const crystalAura = new THREE.Sprite(crystalAuraMat);
    crystalAura.position.set(0, 0.48, 0.72);
    crystalAura.scale.set(3.4, 3.4, 1);
    headGroup.add(crystalAura);

    // Facet overlay for a more cut-gem look
    const facet = mesh(
      new THREE.OctahedronGeometry(0.625,0),
      new THREE.MeshBasicMaterial({color:0xffffff, wireframe:true, transparent:true, opacity:0.12}),
      {y:0.48, sy:1.1, sx:1.08}
    );
    facet.rotation.y = Math.PI/4;
    headGroup.add(facet);

    // ---------- Dark cage ----------
    function createCageStrut(angle) {
      const radius = 0.72;
      const zOff = 0.0;

      const pts = [
        new THREE.Vector3(0.42, -0.18, zOff),
        new THREE.Vector3(0.62,  0.02, zOff),
        new THREE.Vector3(0.64,  0.48, zOff),
        new THREE.Vector3(0.50,  1.16, zOff)
      ];

      const curve = new THREE.CatmullRomCurve3(pts);
      const strut = new THREE.Mesh(
        new THREE.TubeGeometry(curve, 40, 0.055, 10, false),
        darkMat
      );
      strut.rotation.y = angle;
      strut.castShadow = true;
      return strut;
    }

    headGroup.add(createCageStrut(0));
    headGroup.add(createCageStrut(Math.PI));
    headGroup.add(createCageStrut(Math.PI/2));
    headGroup.add(createCageStrut(-Math.PI/2));

    // top and bottom cage bars
    headGroup.add(mesh(new THREE.CylinderGeometry(0.69,0.69,0.09,64), darkMat, {y:1.18}));
    headGroup.add(mesh(new THREE.CylinderGeometry(0.63,0.63,0.09,64), darkMat, {y:-0.12}));

    // center vertical bar, like reference silhouette
    headGroup.add(mesh(new THREE.CylinderGeometry(0.04,0.04,1.35,16), darkMat, {y:0.48}));

    // tiny top cap
    headGroup.add(mesh(new THREE.SphereGeometry(0.11,24,18), darkMat, {y:1.48}));
    headGroup.add(mesh(new THREE.CylinderGeometry(0.055,0.055,0.18,12), darkMat, {y:1.42}));

    // ---------- Outer glass dome ----------
    // Lathe profile produces a lantern-like rounded dome
    const domeProfile = [
      new THREE.Vector2(0.43, -0.30),
      new THREE.Vector2(0.60, -0.08),
      new THREE.Vector2(0.77,  0.38),
      new THREE.Vector2(0.75,  0.90),
      new THREE.Vector2(0.64,  1.42),
      new THREE.Vector2(0.46,  1.72),
      new THREE.Vector2(0.27,  1.82),
      new THREE.Vector2(0.00,  1.82)
    ];
    const dome = mesh(new THREE.LatheGeometry(domeProfile, 72), glassMat, {y:-0.10});
    dome.scale.set(1.14, 1.00, 1.08);
    headGroup.add(dome);

    // ---------- Floor ----------
    const floor = new THREE.Mesh(
      new THREE.CircleGeometry(5.5, 96),
      new THREE.MeshStandardMaterial({color:0xffffff, roughness:0.95, metalness:0.0})
    );
    floor.rotation.x = -Math.PI/2;
    floor.position.y = -4.02;
    floor.receiveShadow = true;
    scene.add(floor);

    // ---------- Interaction ----------
    let lightOn = false;

    function setLightState(on) {
      lightOn = on;
      document.getElementById('toggle').textContent = on ? 'LIGHT OFF' : 'LIGHT ON';

      crystalMat.emissiveIntensity = on ? 8 : 0;
      crystalMat.transmission = on ? 0 : 0.58;
      crystalMat.opacity = on ? 1 : 0.68;
      crystalMat.transparent = !on;
      crystalMat.needsUpdate = true;
      crystalAuraMat.opacity = on ? 1 : 0;
    }

    document.getElementById('toggle').addEventListener('click', () => setLightState(!lightOn));

    const raycaster = new THREE.Raycaster();
    const pointer = new THREE.Vector2();

    renderer.domElement.addEventListener('pointerdown', (event) => {
      const rect = renderer.domElement.getBoundingClientRect();
      pointer.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
      pointer.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
      raycaster.setFromCamera(pointer, camera);
      const hits = raycaster.intersectObject(button, true);
      if (hits.length) setLightState(!lightOn);
    });

    // ---------- Animation ----------
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);

      const t = clock.getElapsedTime();

      controls.update();

      // subtle showroom motion
      lightstick.rotation.y += 0.0012;
      crystal.rotation.y = Math.PI/4 + Math.sin(t * 0.55) * 0.10;
      facet.rotation.y = crystal.rotation.y;

      if (lightOn) {
        crystalMat.emissiveIntensity = 7 + Math.sin(t * 3.2) * 1;
        crystalAuraMat.opacity = 0.95 + Math.sin(t * 2.4) * 0.05;
        const auraSize = 3.3 + Math.sin(t * 2.4) * 0.24;
        crystalAura.scale.set(auraSize, auraSize, 1);
      }

      renderer.render(scene, camera);
    }

    animate();

    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });
  </script>
</body>
</html>
