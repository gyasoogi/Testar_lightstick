<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Three.js Lightstick Prototype</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 30%, #f8fbff 0%, #e8edf5 38%, #cfd6e2 100%);
      font-family: Arial, sans-serif;
    }
    body.dark-mode {
      background: radial-gradient(circle at 50% 30%, #242a37 0%, #11151e 48%, #080a10 100%);
    }
    #app {
      position: relative;
      width: 100%;
      height: 100%;
      z-index: 1;
    }
    #cameraFeed {
      position: fixed;
      inset: 0;
      z-index: 0;
      display: none;
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: #10131a;
    }
    body.camera-active #cameraFeed {
      display: block;
    }
    body.front-camera-active #cameraFeed {
      transform: scaleX(-1);
    }
    .capture-frame,
    .capture-frame img,
    .phone-bottom-frame,
    #phoneCaptureButton {
      display: none;
    }
    .capture-frame {
      position: fixed;
      inset: 0;
      z-index: 20;
      pointer-events: none;
    }
    body.capture-mode .capture-frame {
      display: block;
    }
    body.capture-mode .ui,
    body.capture-mode .part-panel {
      display: none;
    }
    body.capture-mode .capture-frame .desktop-frame {
      display: block;
      width: 100%;
      height: 100%;
    }
    body.capture-mode .capture-frame .desktop-overlay {
      position: absolute;
      display: block;
      width: min(38vw, 50vh);
      height: auto;
    }
    body.capture-mode .capture-frame .desktop-left-top {
      top: 0;
      left: 0;
    }
    body.capture-mode .capture-frame .desktop-left-bottom {
      bottom: 0;
      left: 0;
    }
    body.capture-mode .capture-frame .desktop-middle-bottom {
      bottom: 0;
      left: 50%;
      width: min(19vw, 25vh);
      transform: translateX(-50%);
    }
    body.capture-mode .capture-frame .desktop-right-top {
      top: 0;
      right: 0;
    }
    body.capture-mode .capture-frame .desktop-right-bottom {
      right: 0;
      bottom: 0;
    }
    @media (max-width: 600px) {
      body.capture-mode .capture-frame .desktop-frame {
        display: none;
      }
      body.capture-mode .capture-frame .desktop-overlay {
        display: none;
      }
      body.capture-mode .capture-frame .phone-frame {
        position: absolute;
        display: block;
        width: 100%;
        height: auto;
      }
      body.capture-mode .capture-frame .phone-top {
        top: 0;
      }
      body.capture-mode .capture-frame .phone-bottom-frame {
        position: absolute;
        bottom: 0;
        left: 0;
        display: block;
        width: 100%;
        aspect-ratio: 2398 / 1024;
      }
      body.capture-mode .capture-frame .phone-bottom {
        inset: 0;
        bottom: 0;
        width: 100%;
        height: 100%;
        object-fit: fill;
      }
      body.capture-mode .phone-bottom-frame #phoneCaptureButton {
        position: absolute;
        left: 50%;
        top: 58.6%;
        display: block;
        width: 64px;
        height: 64px;
        padding: 0;
        transform: translate(-50%, -50%);
        border: 0;
        border-radius: 50%;
        background: transparent;
        cursor: pointer;
        pointer-events: auto;
        touch-action: manipulation;
      }
      body.capture-mode #phoneCaptureButton:focus-visible {
        outline: 2px solid #4b8cff;
        outline-offset: 2px;
      }
    }
    .ui {
      position: fixed;
      left: 18px;
      bottom: 18px;
      z-index: 5;
      padding: 12px 14px;
      border-radius: 14px;
      background: rgba(255,255,255,.72);
      backdrop-filter: blur(12px);
      box-shadow: 0 10px 30px rgba(30,45,70,.12);
      color: #263244;
      font-size: 13px;
      line-height: 1.55;
      user-select: none;
    }
    .ui b { font-size: 14px; }
    .ui button {
      margin-top: 8px;
      padding: 7px 11px;
      border: 0;
      border-radius: 999px;
      background: #222836;
      color: white;
      cursor: pointer;
      font-weight: 700;
    }
    .ui button + button {
      margin-left: 5px;
    }
    .view-controls {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-top: 3px;
    }
    .view-controls button {
      margin: 0;
      padding: 6px 9px;
      font-size: 11px;
    }
    .view-controls button + button {
      margin-left: 0;
    }
    .camera-height-controls {
      position: fixed;
      top: 50%;
      left: 14px;
      z-index: 8;
      display: grid;
      grid-template-columns: repeat(3, 44px);
      grid-template-rows: repeat(3, 44px);
      gap: 4px;
      transform: translateY(-50%);
    }
    .camera-height-controls button {
      display: grid;
      width: 44px;
      aspect-ratio: 1;
      place-items: center;
      padding: 0;
      border: 1px solid rgba(45, 55, 72, .22);
      border-radius: 50%;
      background: rgba(255, 255, 255, .84);
      box-shadow: 0 4px 12px rgba(30, 45, 70, .16);
      color: #263244;
      cursor: pointer;
      font-size: 20px;
      line-height: 1;
      touch-action: manipulation;
    }
    .camera-height-controls [data-axis="y"][data-direction="1"] {
      grid-column: 2;
      grid-row: 1;
    }
    .camera-height-controls [data-axis="x"][data-direction="-1"] {
      grid-column: 1;
      grid-row: 2;
    }
    .camera-height-controls [data-axis="x"][data-direction="1"] {
      grid-column: 3;
      grid-row: 2;
    }
    .camera-height-controls [data-axis="y"][data-direction="-1"] {
      grid-column: 2;
      grid-row: 3;
    }
    .camera-height-controls button:hover {
      background: #fff;
    }
    body.dark-mode .camera-height-controls button {
      border-color: rgba(220, 230, 250, .24);
      background: rgba(22, 27, 38, .88);
      color: #e6eaf2;
    }
    body.capture-mode .camera-height-controls {
      display: none;
    }
    #captureControls {
      position: fixed;
      top: 16px;
      left: 50%;
      z-index: 30;
      display: flex;
      gap: 8px;
      transform: translateX(-50%);
    }
    #captureControls[hidden] {
      display: none;
    }
    #captureControls button {
      padding: 8px 12px;
      border: 0;
      border-radius: 999px;
      background: #222836;
      color: white;
      cursor: pointer;
      font: inherit;
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
    }
    body.dark-mode #captureControls button {
      background: #e6eaf2;
      color: #222836;
    }
    #combinationTransformationToggle {
      width: 100%;
      margin: 0 0 6px;
      padding: 6px 9px;
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: #657084;
      text-align: left;
      box-shadow: inset 0 0 0 1px rgba(70, 82, 104, .2);
      cursor: pointer;
      font: inherit;
      font-size: 11px;
      font-weight: 600;
    }
    #combinationTransformationToggle[aria-pressed="true"] {
      background: #6b4de6;
      color: white;
    }
    #combinationTransformationToggle[hidden] {
      display: none;
    }
    body.dark-mode .ui {
      background: rgba(22,27,38,.82);
      color: #e6eaf2;
      box-shadow: 0 10px 30px rgba(0,0,0,.3);
    }
    body.dark-mode .ui button {
      background: #e6eaf2;
      color: #222836;
    }
    body.dark-mode .view-controls button[aria-pressed="true"] {
      background: #8b72f0;
      color: white;
    }

    .part-panel {
      position: fixed;
      top: 18px;
      right: 18px;
      width: min(210px, calc(100vw - 36px));
      box-sizing: border-box;
      max-height: calc(100vh - 36px);
      overflow: auto;
      z-index: 10;
      padding: 12px;
      border-radius: 10px;
      background: rgba(255,255,255,.8);
      backdrop-filter: blur(12px);
      box-shadow: 0 12px 28px rgba(30,45,70,.12);
      color: #1f2736;
      font-size: 12px;
    }
    body.dark-mode .part-panel {
      background: rgba(24,29,40,.88);
      color: #e6eaf2;
      box-shadow: 0 12px 28px rgba(0,0,0,.35);
    }
    body.dark-mode .part-panel h3 {
      color: #f0f3fa;
    }
    body.dark-mode .part-panel-toggle {
      background: #e6eaf2;
      color: #222836;
    }
    body.dark-mode #combinationTransformationToggle {
      background: #8b72f0;
      color: white;
    }
    body.dark-mode #combinationTransformationToggle[aria-pressed="false"] {
      background: transparent;
      color: #c1cada;
      box-shadow: inset 0 0 0 1px rgba(220,230,250,.24);
    }
    body.dark-mode .part-slot {
      border-bottom-color: rgba(220,230,250,.16);
    }
    body.dark-mode .part-slot select {
      border-color: rgba(220,230,250,.22);
      background: #303747;
      color: #f0f3fa;
    }
    .part-panel.collapsed {
      width: auto;
    }
    .part-panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .part-panel h3 {
      margin: 0;
      font-size: 13px;
      letter-spacing: .04em;
      text-transform: uppercase;
      color: #384159;
    }
    .part-panel-toggle {
      flex: none;
      padding: 5px 9px;
      border: 0;
      border-radius: 999px;
      background: #222836;
      color: white;
      cursor: pointer;
      font: inherit;
      font-weight: 700;
    }
    .part-panel-content {
      margin-top: 12px;
    }
    .spindle-control {
      display: flex;
      align-items: center;
      gap: 7px;
      margin-bottom: 10px;
      font-weight: 700;
      cursor: pointer;
    }
    .spindle-control input {
      margin: 0;
      accent-color: #2d6df6;
    }
    .part-slot {
      margin-bottom: 4px;
      padding: 4px 0;
      border-bottom: 1px solid rgba(40, 52, 70, 0.12);
    }
    .part-slot-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      margin-bottom: 2px;
      font-weight: 700;
    }
    .part-control-label {
      display: flex;
      align-items: center;
      gap: 5px;
      margin-top: 0;
      font-size: 9px;
      opacity: .75;
    }
    .heart-color-control {
      display: flex;
      align-items: center;
      gap: 6px;
      margin: 2px 0;
      font-size: 9px;
    }
    .heart-color-control[hidden] {
      display: none;
    }
    .heart-color-control input {
      width: 25px;
      height: 19px;
      padding: 0;
      border: 1px solid rgba(30,45,70,.2);
      border-radius: 5px;
      background: transparent;
      cursor: pointer;
    }
    .part-slot select {
      flex: 1;
      width: 0;
      min-width: 0;
      margin: 0;
      padding: 4px 6px;
      border: 1px solid rgba(30,45,70,.14);
      border-radius: 6px;
      background: white;
      color: #1f2736;
      font-size: 11px;
    }
    .part-slot input[type="range"] {
      flex: 1;
      min-width: 0;
      accent-color: #2d6df6;
      display: block;
      height: 14px;
      margin: 0;
    }
    @media (max-width: 600px) {
      #captureControls {
        top: 10px;
        gap: 6px;
      }
      #takeCapture {
        display: none;
      }
      #captureControls button {
        padding: 7px 10px;
        font-size: 11px;
      }
      .view-controls button {
        padding: 5px 8px;
        font-size: 10px;
      }
      .camera-height-controls {
        left: 8px;
      }
      .camera-height-controls button {
        width: 36px;
        font-size: 18px;
      }
      .camera-height-controls {
        grid-template-columns: repeat(3, 36px);
        grid-template-rows: repeat(3, 36px);
        gap: 3px;
      }
      .part-panel {
        top: 10px;
        right: 10px;
        width: min(175px, calc(100vw - 20px));
        max-height: calc(100vh - 20px);
        padding: 9px;
        font-size: 11px;
      }
      .part-panel-header {
        gap: 8px;
      }
      .part-panel h3 {
        font-size: 12px;
      }
      .part-panel-toggle {
        padding: 4px 8px;
      }
      .part-panel-content {
        margin-top: 8px;
      }
      .spindle-control {
        margin-bottom: 7px;
      }
      .part-slot {
        margin-bottom: 4px;
        padding: 4px 0;
      }
      .part-slot select {
        padding: 4px 5px;
        font-size: 10px;
      }
      .part-control-label {
        gap: 4px;
        font-size: 8px;
      }
      .heart-color-control {
        gap: 5px;
        font-size: 8px;
      }
      .heart-color-control input {
        width: 22px;
        height: 17px;
      }
    }
  </style>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.181.1/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.181.1/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <video id="cameraFeed" autoplay playsinline muted></video>
  <div id="app"></div>
  <div class="camera-height-controls" id="cameraHeightControls" aria-label="시점과 위치 이동">
    <button type="button" data-axis="y" data-direction="1" aria-label="카메라 시점 올리기" title="시점 올리기">▲</button>
    <button type="button" data-axis="x" data-direction="-1" aria-label="카메라 시점 왼쪽" title="시점 왼쪽">◀</button>
    <button type="button" data-axis="x" data-direction="1" aria-label="카메라 시점 오른쪽" title="시점 오른쪽">▶</button>
    <button type="button" data-axis="y" data-direction="-1" aria-label="카메라 시점 내리기" title="시점 내리기">▼</button>
  </div>
  <div class="capture-frame">
    <img class="desktop-overlay desktop-left-top" src="img/desktop-left-top.png" alt="" />
    <img class="desktop-overlay desktop-left-bottom" src="img/desktop-left-bottom.png" alt="" />
    <img class="desktop-overlay desktop-middle-bottom" src="img/desktop-middle-bottom.png" alt="" />
    <img class="desktop-overlay desktop-right-top" src="img/desktop-right-top.png" alt="" />
    <img class="desktop-overlay desktop-right-bottom" src="img/desktop-right-bottom.png" alt="" />
    <img class="phone-frame phone-top" src="img/phone-top.png" alt="" />
    <div class="phone-bottom-frame">
      <img class="phone-frame phone-bottom" src="img/phone-bottom.png" alt="" />
      <button id="phoneCaptureButton" type="button" aria-label="폰 버튼을 눌러 화면 캡처" title="화면 캡처"></button>
    </div>
  </div>

  <div class="ui">
    <span id="viewHint">드래그: 회전 · 휠: 확대/축소</span><br/>
    버튼 클릭: 조명 ON/OFF<br/>
    <button id="toggle">LIGHT ON</button>
    <button id="darkModeToggle" type="button" aria-pressed="false">다크모드 OFF</button>
    <div class="view-controls">
      <button id="resetView" type="button">시점 초기화</button>
      <button id="frontModeToggle" type="button" aria-pressed="false">정면 조작 OFF</button>
      <button id="cameraToggle" type="button" aria-pressed="false">카메라 켜기</button>
      <button id="cameraFacingToggle" type="button" hidden>전면으로 전환</button>
      <button id="captureModeToggle" type="button">캡쳐 모드</button>
    </div>
  </div>
  <div id="captureControls" hidden>
    <button id="exitCaptureMode" type="button">모드 OFF</button>
    <button id="takeCapture" type="button">화면 캡쳐</button>
  </div>
  <div class="part-panel" id="partPanel">
    <div class="part-panel-header">
      <h3 id="partPanelTitle">커스터마이저</h3>
      <button class="part-panel-toggle" id="partPanelToggle" type="button" aria-expanded="true" aria-controls="partPanelContent">접기</button>
    </div>
    <button id="combinationTransformationToggle" type="button" aria-pressed="true" hidden>변신 ON</button>
    <div class="part-panel-content" id="partPanelContent">
      <label class="spindle-control"><input id="spindleToggle" type="checkbox" checked /> 중앙 축 표시</label>
    </div>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

    const container = document.getElementById('app');

    const scene = new THREE.Scene();
    scene.background = null;

    const camera = new THREE.PerspectiveCamera(34, innerWidth / innerHeight, 0.1, 100);
    const defaultCameraPosition = new THREE.Vector3(5.4, 3.35, 8.6);
    const defaultCameraTarget = new THREE.Vector3(0, 0.25, 0);
    const frontCameraPosition = new THREE.Vector3(0, 0.8, 8.5);
    const frontCameraTarget = new THREE.Vector3(0, 0, 0);
    camera.position.copy(defaultCameraPosition);
    camera.lookAt(defaultCameraTarget);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 0.7;
    renderer.localClippingEnabled = true;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    container.appendChild(renderer.domElement);

    const reflectionRandom = (seed) => {
      const value = Math.sin(seed * 127.1 + 311.7) * 43758.5453;
      return value - Math.floor(value);
    };

    const environmentGenerator = new THREE.PMREMGenerator(renderer);
    scene.environment = environmentGenerator.fromScene(new RoomEnvironment(), 0.04).texture;
    environmentGenerator.dispose();

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.target.copy(defaultCameraTarget);
    controls.minDistance = 5.2;
    controls.maxDistance = 15;
    controls.maxPolarAngle = Math.PI * 0.82;
    controls.saveState();
    renderer.domElement.style.touchAction = 'none';

    // ---------- Lighting ----------
    const hemisphere = new THREE.HemisphereLight(0xffffff, 0x9ba6b6, 0.7);
    scene.add(hemisphere);

    const key = new THREE.DirectionalLight(0xffffff, 1.2);
    key.position.set(4, 7, 6);
    key.castShadow = true;
    key.shadow.mapSize.set(2048, 2048);
    scene.add(key);

    const rim = new THREE.PointLight(0xcce8ff, 0.45, 20);
    rim.position.set(-4, 5, -2);
    scene.add(rim);

    const warm = new THREE.PointLight(0xffdcc5, 0.4, 14);
    warm.position.set(3, 1, 3);
    scene.add(warm);

    // ---------- Materials ----------
    const whiteMat = new THREE.MeshPhysicalMaterial({
      color: 0xf5f6f8,
      roughness: 0.32,
      metalness: 0.08,
      clearcoat: 0.35,
      clearcoatRoughness: 0.18
    });

    const darkMat = new THREE.MeshStandardMaterial({
      color: 0x24262c,
      roughness: 0.28,
      metalness: 0.65
    });

    const glassMat = new THREE.MeshPhysicalMaterial({
      color: 0xf9fcff,
      transmission: 0.9,
      transparent: true,
      opacity: 0.28,
      roughness: 0.08,
      thickness: 0.45,
      ior: 1.45,
      side: THREE.DoubleSide,
      depthWrite: false
    });

    const creamMat = new THREE.MeshStandardMaterial({
      color: 0xffe9ad,
      roughness: 0.65,
      metalness: 0.0
    });

    const crystalMat = new THREE.MeshPhysicalMaterial({
      color: 0xffffff,
      vertexColors: true,
      transmission: 0.12,
      roughness: 0.08,
      metalness: 0,
      emissive: 0xffffff,
      emissiveIntensity: 0,
      clearcoat: 1,
      clearcoatRoughness: 0.02,
      ior: 2.4,
      reflectivity: 1
    });

    const glowCanvas = document.createElement('canvas');
    glowCanvas.width = 128;
    glowCanvas.height = 128;
    const glowContext = glowCanvas.getContext('2d');
    if (!glowContext) throw new Error('보석 후광 텍스처를 만들 수 없습니다.');
    const glowGradient = glowContext.createRadialGradient(64, 64, 0, 64, 64, 64);
    glowGradient.addColorStop(0, 'rgba(190, 205, 255, 0.22)');
    glowGradient.addColorStop(0.32, 'rgba(160, 180, 255, 0.42)');
    glowGradient.addColorStop(0.65, 'rgba(145, 165, 255, 0.2)');
    glowGradient.addColorStop(1, 'rgba(130, 155, 255, 0)');
    glowContext.fillStyle = glowGradient;
    glowContext.fillRect(0, 0, 128, 128);
    const crystalAuraMat = new THREE.SpriteMaterial({
      map: new THREE.CanvasTexture(glowCanvas),
      color: 0xaebfff,
      transparent: true,
      opacity: 0,
      blending: THREE.AdditiveBlending,
      depthWrite: false
    });
    const reflectionColors = [0xffe7a6, 0xc7efff, 0xffc9e8, 0xffffff];
    const reflections = Array.from({ length: 42 }, (_, index) => {
      const azimuth = reflectionRandom(index + 1) * Math.PI * 2;
      const vertical = reflectionRandom(index + 91) * 2 - 1;
      const horizontal = Math.sqrt(1 - vertical * vertical);
      const radius = 4.2 + reflectionRandom(index + 181) * 5.8;
      const reflection = new THREE.Sprite(new THREE.SpriteMaterial({
        map: crystalAuraMat.map,
        color: reflectionColors[Math.floor(reflectionRandom(index + 271) * reflectionColors.length)],
        transparent: true,
        opacity: 0,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
        toneMapped: false
      }));
      const size = 0.12 + reflectionRandom(index + 541) * 0.22;
      reflection.scale.set(size, size, 1);
      reflection.userData.baseSize = size;
      reflection.position.set(
        Math.cos(azimuth) * horizontal * radius,
        1.7 + vertical * radius * 0.9,
        Math.sin(azimuth) * horizontal * radius
      );
      reflection.userData.phase = reflectionRandom(index + 361) * Math.PI * 2;
      reflection.userData.baseOpacity = 0.55 + reflectionRandom(index + 451) * 0.45;
      scene.add(reflection);
      return reflection;
    });

    function applyPartEdits(model, edits = {}) {
      for (const child of model.children) {
        const edit = edits[child.name];
        if (!edit) continue;
        const position = edit.position || [0, 0, 0];
        const rotation = edit.rotation || [0, 0, 0];
        const axisScale = edit.axisScale || [1, 1, 1];
        child.position.add(new THREE.Vector3(...position));
        child.rotation.x += THREE.MathUtils.degToRad(rotation[0] || 0);
        child.rotation.y += THREE.MathUtils.degToRad(rotation[1] || 0);
        child.rotation.z += THREE.MathUtils.degToRad(rotation[2] || 0);
        child.scale.multiplyScalar(edit.size ?? 1);
        child.scale.multiply(new THREE.Vector3(...axisScale));
        child.visible = edit.visible !== false;
        if (edit.color) {
          const materials = Array.isArray(child.material) ? child.material : [child.material];
          materials.forEach((material) => material.color?.set(edit.color));
        }
      }
    }

    function applyFeatherClipping(model, clipping, enabled) {
      if (!clipping) return;
      for (const child of model.children) {
        if (!child.name.startsWith('깃털')) continue;
        const materials = Array.isArray(child.material) ? child.material : [child.material];
        materials.forEach((material) => {
          const state = material.userData.cylinderClip ||= {
            enabled,
            radius: clipping.cylinderRadius,
            rootInverse: new THREE.Matrix4(),
            shader: null
          };
          state.enabled = enabled;
          state.radius = clipping.cylinderRadius;
          if (!state.shader) {
            material.onBeforeCompile = (shader) => {
              shader.uniforms.uCylinderRootInverse = { value: state.rootInverse };
              shader.uniforms.uCylinderClipEnabled = { value: state.enabled };
              shader.uniforms.uCylinderClipRadius = { value: state.radius };
              shader.vertexShader = shader.vertexShader
                .replace('#include <common>', '#include <common>\nuniform mat4 uCylinderRootInverse;\nvarying vec3 vCylinderLocalPosition;')
                .replace('#include <begin_vertex>', '#include <begin_vertex>\nvCylinderLocalPosition = (uCylinderRootInverse * modelMatrix * vec4(transformed, 1.0)).xyz;');
              shader.fragmentShader = shader.fragmentShader
                .replace('#include <common>', '#include <common>\nuniform bool uCylinderClipEnabled;\nuniform float uCylinderClipRadius;\nvarying vec3 vCylinderLocalPosition;')
                .replace('#include <opaque_fragment>', 'if (uCylinderClipEnabled && dot(vCylinderLocalPosition.xz, vCylinderLocalPosition.xz) > uCylinderClipRadius * uCylinderClipRadius) discard;\n#include <opaque_fragment>');
              state.shader = shader;
            };
            material.customProgramCacheKey = () => 'cylinder-edge-clip';
            material.needsUpdate = true;
          }
          if (state.shader) {
            state.shader.uniforms.uCylinderClipEnabled.value = enabled;
            state.shader.uniforms.uCylinderClipRadius.value = clipping.cylinderRadius;
          }
        });
        child.onBeforeRender = () => {
          model.updateWorldMatrix(true, false);
          const rootInverse = model.matrixWorld.clone().invert();
          const materials = Array.isArray(child.material) ? child.material : [child.material];
          materials.forEach((material) => {
            const state = material.userData.cylinderClip;
            if (state) state.rootInverse.copy(rootInverse);
          });
        };
      }
    }

    function createForeheadRibbon(head, color) {
      const ribbon = new THREE.Group();
      const ribbonMaterial = new THREE.MeshPhysicalMaterial({
        color,
        roughness: 0.28,
        metalness: 0.04,
        clearcoat: 0.8,
        clearcoatRoughness: 0.18,
        side: THREE.DoubleSide
      });
      const loopShape = new THREE.Shape();
      loopShape.moveTo(0, 0);
      loopShape.quadraticCurveTo(-0.05, 0.19, -0.29, 0.22);
      loopShape.quadraticCurveTo(-0.43, 0.16, -0.37, 0);
      loopShape.quadraticCurveTo(-0.43, -0.16, -0.29, -0.22);
      loopShape.quadraticCurveTo(-0.05, -0.19, 0, 0);
      const loopGeometry = new THREE.ExtrudeGeometry(loopShape, {
        depth: 0.055,
        bevelEnabled: true,
        bevelSegments: 5,
        bevelSize: 0.03,
        bevelThickness: 0.04,
        steps: 1,
        curveSegments: 12
      });
      const loopPositions = loopGeometry.attributes.position;
      for (let index = 0; index < loopPositions.count; index += 1) {
        const x = loopPositions.getX(index);
        const y = loopPositions.getY(index);
        const domeRadius = ((x + 0.215) / 0.32) ** 2 + (y / 0.27) ** 2;
        const dome = Math.pow(Math.max(0, 1 - domeRadius), 1.5);
        loopPositions.setZ(index, loopPositions.getZ(index) + 0.18 * dome);
      }
      loopGeometry.computeVertexNormals();
      const leftLoop = new THREE.Mesh(loopGeometry, ribbonMaterial);
      leftLoop.position.z = -0.045;
      ribbon.add(leftLoop);

      const rightLoop = new THREE.Mesh(loopGeometry, ribbonMaterial);
      rightLoop.position.z = -0.045;
      rightLoop.scale.x = -1;
      ribbon.add(rightLoop);

      const knot = new THREE.Mesh(new THREE.SphereGeometry(0.065, 14, 10), ribbonMaterial);
      knot.position.z = 0.045;
      knot.scale.set(1.05, 1.1, 0.85);
      ribbon.add(knot);
      ribbon.scale.setScalar(1.45);
      ribbon.position.set(0, 0.7, 0.64);
      ribbon.rotation.x = -Math.PI / 4;
      ribbon.visible = false;
      head.add(ribbon);
      return ribbon;
    }

    // ---------- Crystal ----------
    function createBrilliantCutGeometry() {
      const sides = 8;
      const table = [];
      const crown = [];
      const girdle = [];
      const culet = new THREE.Vector3(0, -0.32, 0);
      for (let index = 0; index < sides; index += 1) {
        const angle = (index / sides) * Math.PI * 2 + Math.PI / sides;
        const cosine = Math.cos(angle);
        const sine = Math.sin(angle);
        table.push(new THREE.Vector3(cosine * 0.18, 0.29, sine * 0.18));
        crown.push(new THREE.Vector3(cosine * 0.31, 0.18, sine * 0.31));
        girdle.push(new THREE.Vector3(cosine * 0.44, 0.04, sine * 0.44));
      }

      const vertices = [];
      const colors = [];
      const addFace = (a, b, c, shade) => {
        const normal = new THREE.Vector3()
          .subVectors(b, a)
          .cross(new THREE.Vector3().subVectors(c, a));
        const center = new THREE.Vector3().add(a).add(b).add(c);
        if (normal.dot(center) < 0) [b, c] = [c, b];
        for (const point of [a, b, c]) {
          vertices.push(point.x, point.y, point.z);
          colors.push(shade, shade, shade);
        }
      };

      const center = new THREE.Vector3(0, 0.29, 0);
      for (let index = 0; index < sides; index += 1) {
        const next = (index + 1) % sides;
        const shade = [0.78, 1, 0.9, 0.84, 0.96, 0.74][index % 6];
        addFace(center, table[index], table[next], 1);
        addFace(table[index], crown[index], crown[next], shade);
        addFace(table[index], crown[next], table[next], shade);
        addFace(crown[index], girdle[index], girdle[next], shade);
        addFace(crown[index], girdle[next], crown[next], shade);
        addFace(girdle[index], culet, girdle[next], shade);
      }

      const geometry = new THREE.BufferGeometry();
      geometry.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
      geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
      geometry.computeVertexNormals();
      return geometry;
    }

    const crystal = mesh(createBrilliantCutGeometry(), crystalMat, {y:0.33, sx:1.35, sy:1.6, sz:1.35});
    crystal.rotation.y = Math.PI/4;
    headGroup.add(crystal);

    crystal.geometry.computeBoundingBox();
    const crystalCenter = crystal.geometry.boundingBox.getCenter(new THREE.Vector3())
      .multiply(crystal.scale)
      .applyEuler(crystal.rotation)
      .add(crystal.position);

    const crystalLight = new THREE.PointLight(0xdde8ff, 0, 6, 2);

    const crystalAura = new THREE.Sprite(crystalAuraMat);

    // ---------- Dark cage ----------
    function createCageStrut(angle) {
      const radius = 0.72;

        new THREE.Vector3(0.62,  0.02, zOff),
        new THREE.Vector3(0.64,  0.48, zOff),
        new THREE.Vector3(0.50,  1.16, zOff)
      ];

      const curve = new THREE.CatmullRomCurve3(pts);
      const strut = new THREE.Mesh(
        new THREE.TubeGeometry(curve, 40, 0.055, 10, false),
        darkMat
      );
      strut.rotation.y = angle;
      strut.castShadow = true;
      return strut;
    }

    headGroup.add(createCageStrut(0));
    headGroup.add(createCageStrut(Math.PI));
    headGroup.add(createCageStrut(Math.PI/2));
    headGroup.add(createCageStrut(-Math.PI/2));

    // top and bottom cage bars
    headGroup.add(mesh(new THREE.CylinderGeometry(0.69,0.69,0.09,64), darkMat, {y:1.18}));
    headGroup.add(mesh(new THREE.CylinderGeometry(0.63,0.63,0.09,64), darkMat, {y:-0.12}));

    // center vertical bar, like reference silhouette
    headGroup.add(mesh(new THREE.CylinderGeometry(0.04,0.04,1.35,16), darkMat, {y:0.48}));

    // tiny top cap
    headGroup.add(mesh(new THREE.SphereGeometry(0.11,24,18), darkMat, {y:1.37}));
    headGroup.add(mesh(new THREE.CylinderGeometry(0.055,0.055,0.18,12), darkMat, {y:1.31}));

    // ---------- Outer glass dome ----------
    // Lathe profile produces a lantern-like rounded dome
    const domeProfile = [
      new THREE.Vector2(0.43, -0.30),
      new THREE.Vector2(0.60, -0.08),
      new THREE.Vector2(0.77,  0.38),
      new THREE.Vector2(0.75,  0.90),
      new THREE.Vector2(0.64,  1.42),
      new THREE.Vector2(0.46,  1.72),
      new THREE.Vector2(0.27,  1.82),
      new THREE.Vector2(0.00,  1.82)
    ];
    const dome = mesh(new THREE.LatheGeometry(domeProfile, 72), glassMat, {y:-0.10});
    dome.scale.set(1.14, 1.00, 1.08);
    headGroup.add(dome);

    // ---------- Interaction ----------
    let lightOn = false;
    let darkModeOn = false;
    let cameraStream = null;
    let cameraFacingMode = 'environment';
    let cameraRequestId = 0;

    function setLightState(on) {
      lightOn = on;
      document.getElementById('toggle').textContent = on ? 'LIGHT OFF' : 'LIGHT ON';

      crystalMat.emissiveIntensity = on ? 8 : 0;
      crystalAuraMat.opacity = on ? 1 : 0;
      crystalLight.intensity = on ? 9 : 0;
      reflections.forEach((reflection) => {
        reflection.material.opacity = on ? reflection.userData.baseOpacity : 0;
      });
    }

    document.getElementById('toggle').addEventListener('click', () => setLightState(!lightOn));
    const darkModeToggle = document.getElementById('darkModeToggle');
    const resetViewButton = document.getElementById('resetView');
    const frontModeToggle = document.getElementById('frontModeToggle');
    const captureModeToggle = document.getElementById('captureModeToggle');
    const captureControls = document.getElementById('captureControls');
    const exitCaptureMode = document.getElementById('exitCaptureMode');
    const takeCapture = document.getElementById('takeCapture');
    const phoneCaptureButton = document.getElementById('phoneCaptureButton');
    const cameraHeightControls = document.getElementById('cameraHeightControls');
    const cameraFeed = document.getElementById('cameraFeed');
    const cameraToggle = document.getElementById('cameraToggle');
    const cameraFacingToggle = document.getElementById('cameraFacingToggle');
    const viewHint = document.getElementById('viewHint');
    const lightstickBaseY = lightstick.position.y;
    let frontMode = false;
    let activeFrontPointerId = null;
    let lastPointerX = 0;
    let captureMode = false;

    function setCaptureMode(enabled) {
      captureMode = enabled;
      document.body.classList.toggle('capture-mode', enabled);
      captureControls.hidden = !enabled;
    }

    captureModeToggle.addEventListener('click', () => setCaptureMode(true));
    exitCaptureMode.addEventListener('click', () => setCaptureMode(false));

    function stopCamera() {
      cameraRequestId += 1;
      cameraStream?.getTracks().forEach((track) => track.stop());
      cameraStream = null;
      cameraFeed.pause();
      cameraFeed.srcObject = null;
      document.body.classList.remove('camera-active');
      document.body.classList.remove('front-camera-active');
      cameraToggle.textContent = '카메라 켜기';
      cameraToggle.setAttribute('aria-pressed', 'false');
      cameraFacingToggle.hidden = true;
      cameraToggle.disabled = false;
      cameraFacingToggle.disabled = false;
    }

    async function startCamera() {
      if (!navigator.mediaDevices?.getUserMedia) {
        alert('카메라를 사용할 수 없습니다. HTTPS 또는 localhost에서 페이지를 열어 주세요.');
        return false;
      }

      const requestId = ++cameraRequestId;
      cameraToggle.disabled = true;
      cameraFacingToggle.disabled = true;
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          audio: false,
          video: {
            facingMode: { ideal: cameraFacingMode },
            width: { ideal: 1280 },
            height: { ideal: 720 }
          }
        });
        if (requestId !== cameraRequestId) {
          stream.getTracks().forEach((track) => track.stop());
          return false;
        }

        cameraStream = stream;
        cameraFeed.srcObject = stream;
        await cameraFeed.play();
        document.body.classList.add('camera-active');
        document.body.classList.toggle('front-camera-active', cameraFacingMode === 'user');
        cameraToggle.textContent = '카메라 끄기';
        cameraToggle.setAttribute('aria-pressed', 'true');
        cameraFacingToggle.textContent = cameraFacingMode === 'environment'
          ? '전면으로 전환'
          : '후면으로 전환';
        cameraFacingToggle.hidden = false;
        stream.getVideoTracks()[0]?.addEventListener('ended', () => {
          if (cameraStream === stream) stopCamera();
        }, { once: true });
        return true;
      } catch (error) {
        if (requestId === cameraRequestId) {
          cameraStream?.getTracks().forEach((track) => track.stop());
          cameraStream = null;
          cameraFeed.srcObject = null;
          document.body.classList.remove('camera-active', 'front-camera-active');
          cameraToggle.textContent = '카메라 켜기';
          cameraToggle.setAttribute('aria-pressed', 'false');
          cameraFacingToggle.hidden = true;
          alert(`카메라를 시작할 수 없습니다: ${error instanceof Error ? error.message : String(error)}`);
        }
        return false;
      } finally {
        if (requestId === cameraRequestId) {
          cameraToggle.disabled = false;
          cameraFacingToggle.disabled = false;
        }
      }
    }

    cameraToggle.addEventListener('click', () => {
      if (cameraStream) stopCamera();
      else startCamera();
    });

    cameraFacingToggle.addEventListener('click', async () => {
      if (!cameraStream) return;
      cameraFacingMode = cameraFacingMode === 'environment' ? 'user' : 'environment';
      cameraStream.getTracks().forEach((track) => track.stop());
      cameraStream = null;
      cameraFeed.srcObject = null;
      await startCamera();
    });

    async function captureScreen() {
      const captureCanvas = document.createElement('canvas');
      captureCanvas.width = innerWidth;
      captureCanvas.height = innerHeight;
      const context = captureCanvas.getContext('2d');
      if (!context) throw new Error('캡쳐용 캔버스를 준비하지 못했습니다.');

      const width = captureCanvas.width;
      const height = captureCanvas.height;
      if (cameraStream && cameraFeed.readyState >= HTMLMediaElement.HAVE_CURRENT_DATA) {
        if (cameraFacingMode === 'user') {
          context.save();
          context.translate(width, 0);
          context.scale(-1, 1);
        }
        context.drawImage(cameraFeed, 0, 0, width, height);
        if (cameraFacingMode === 'user') context.restore();
      } else {
        const background = context.createRadialGradient(width * 0.5, height * 0.3, 0, width * 0.5, height * 0.3, Math.max(width, height) * 0.75);
        if (darkModeOn) {
          background.addColorStop(0, '#242a37');
          background.addColorStop(0.48, '#11151e');
          background.addColorStop(1, '#080a10');
        } else {
          background.addColorStop(0, '#f8fbff');
          background.addColorStop(0.38, '#e8edf5');
          background.addColorStop(1, '#cfd6e2');
        }
        context.fillStyle = background;
        context.fillRect(0, 0, width, height);
      }
      renderer.render(scene, camera);
      context.drawImage(renderer.domElement, 0, 0, width, height);

      if (matchMedia('(max-width: 600px)').matches) {
        const phoneTop = document.querySelector('.phone-top');
        const phoneBottom = document.querySelector('.phone-bottom');
        if (!phoneTop.complete || !phoneTop.naturalWidth || !phoneBottom.complete || !phoneBottom.naturalWidth) {
          throw new Error('캡쳐 프레임 이미지를 불러오지 못했습니다.');
        }
        const topHeight = width * phoneTop.naturalHeight / phoneTop.naturalWidth;
        const bottomHeight = width * phoneBottom.naturalHeight / phoneBottom.naturalWidth;
        context.drawImage(phoneTop, 0, 0, width, topHeight);
        context.drawImage(phoneBottom, 0, height - bottomHeight, width, bottomHeight);
      } else {
        const cornerWidth = Math.min(width * 0.38, height * 0.5);
        const centerWidth = cornerWidth / 2;
        const desktopFrames = [
          { selector: '.desktop-left-top', x: 0, y: 0, width: cornerWidth },
          { selector: '.desktop-left-bottom', x: 0, y: height - cornerWidth, width: cornerWidth },
          { selector: '.desktop-middle-bottom', x: (width - centerWidth) / 2, y: height - centerWidth, width: centerWidth },
          { selector: '.desktop-right-top', x: width - cornerWidth, y: 0, width: cornerWidth },
          { selector: '.desktop-right-bottom', x: width - cornerWidth, y: height - cornerWidth, width: cornerWidth }
        ];
        desktopFrames.forEach(({ selector, x, y, width: frameWidth }) => {
          const frame = document.querySelector(selector);
          if (!frame.complete || !frame.naturalWidth) {
            throw new Error(`캡쳐 프레임 이미지를 불러오지 못했습니다: ${selector}`);
          }
          const frameHeight = frameWidth * frame.naturalHeight / frame.naturalWidth;
          context.drawImage(frame, x, y, frameWidth, frameHeight);
        });
      }

      const blob = await new Promise((resolve, reject) => {
        captureCanvas.toBlob((result) => {
          if (result) resolve(result);
          else reject(new Error('캡쳐 이미지를 생성하지 못했습니다.'));
        }, 'image/png');
      });
      const downloadUrl = URL.createObjectURL(blob);
      const download = document.createElement('a');
      download.href = downloadUrl;
      download.download = `lightstick-capture-${new Date().toISOString().replace(/[:.]/g, '-')}.png`;
      document.body.appendChild(download);
      download.click();
      download.remove();
      setTimeout(() => URL.revokeObjectURL(downloadUrl), 1000);
    }

    async function handleCaptureRequest() {
      captureControls.hidden = true;
      await new Promise((resolve) => setTimeout(resolve, 50));
      try {
        await captureScreen();
      } catch (error) {
        console.error('화면 캡쳐에 실패했습니다.', error);
        alert(`화면 캡쳐에 실패했습니다: ${error instanceof Error ? error.message : String(error)}`);
      } finally {
        if (captureMode) captureControls.hidden = false;
      }
    }

    takeCapture.addEventListener('click', handleCaptureRequest);
    phoneCaptureButton.addEventListener('click', handleCaptureRequest);

    function setCameraView(front) {
      controls.enabled = true;
      controls.reset();
      camera.position.copy(front ? frontCameraPosition : defaultCameraPosition);
      controls.target.copy(front ? frontCameraTarget : defaultCameraTarget);
      camera.lookAt(controls.target);
      controls.update();
      controls.enabled = !front;
    }

    cameraHeightControls.addEventListener('click', (event) => {
      const button = event.target.closest('button[data-direction]');
      if (!button) return;
      const direction = Number(button.dataset.direction);
      const axis = button.dataset.axis;
      if (frontMode) {
        const property = axis === 'x' ? 'x' : 'y';
        const basePosition = property === 'x' ? 0 : lightstickBaseY;
        lightstick.position[property] = THREE.MathUtils.clamp(
          lightstick.position[property] + direction * 0.25,
          basePosition - 1.5,
          basePosition + 1.5
        );
        return;
      }
      if (axis === 'x') {
        const horizontalChange = direction * 0.25;
        camera.position.x += horizontalChange;
        controls.target.x += horizontalChange;
        controls.update();
        return;
      }
      const targetY = controls.target.y;
      const nextTargetY = THREE.MathUtils.clamp(targetY + direction * 0.25, -2.5, 4.5);
      const heightChange = nextTargetY - targetY;
      camera.position.y += heightChange;
      controls.target.y = nextTargetY;
      camera.lookAt(controls.target);
      controls.update();
    });

    resetViewButton.addEventListener('click', () => setCameraView(frontMode));
    frontModeToggle.addEventListener('click', () => {
      frontMode = !frontMode;
      controls.enabled = !frontMode;
      activeFrontPointerId = null;
      if (frontMode) {
        lightstick.position.y = lightstickBaseY;
        lightstick.rotation.set(0, 0, 0);
      }
      cameraHeightControls.querySelectorAll('button[data-direction]').forEach((button) => {
        const directionLabel = button.dataset.axis === 'x'
          ? (button.dataset.direction === '-1' ? '왼쪽' : '오른쪽')
          : (button.dataset.direction === '1' ? '올리기' : '내리기');
        const targetLabel = frontMode ? '라이트스틱' : '카메라 시점';
        button.setAttribute('aria-label', `${targetLabel} ${directionLabel}`);
        button.title = `${targetLabel} ${directionLabel}`;
      });
      setCameraView(frontMode);
      frontModeToggle.textContent = `정면 조작 ${frontMode ? 'ON' : 'OFF'}`;
      frontModeToggle.setAttribute('aria-pressed', String(frontMode));
      viewHint.textContent = frontMode
        ? '정면 조작: 좌우 드래그 회전 · 화살표로 상하좌우 이동'
        : '드래그: 회전 · 휠: 확대/축소';
    });

    darkModeToggle.addEventListener('click', () => {
      darkModeOn = !darkModeOn;
      document.body.classList.toggle('dark-mode', darkModeOn);
      darkModeToggle.textContent = darkModeOn ? '다크모드 ON' : '다크모드 OFF';
      darkModeToggle.setAttribute('aria-pressed', String(darkModeOn));

      hemisphere.intensity = darkModeOn ? 0.2 : 0.7;
      key.intensity = darkModeOn ? 0.32 : 1.2;
      rim.intensity = darkModeOn ? 0.2 : 0.45;
      warm.intensity = darkModeOn ? 0.16 : 0.4;
    });

    const raycaster = new THREE.Raycaster();
    const pointer = new THREE.Vector2();

    renderer.domElement.addEventListener('pointerdown', (event) => {
      if (frontMode) {
        if (event.button !== 0) return;
        event.preventDefault();
        activeFrontPointerId = event.pointerId;
        lastPointerX = event.clientX;
        renderer.domElement.setPointerCapture(event.pointerId);
        return;
      }
      const rect = renderer.domElement.getBoundingClientRect();
      pointer.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
      pointer.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
      raycaster.setFromCamera(pointer, camera);
      const hits = raycaster.intersectObject(button, true);
      if (hits.length) setLightState(!lightOn);
    });

    renderer.domElement.addEventListener('pointermove', (event) => {
      if (!frontMode || event.pointerId !== activeFrontPointerId) return;
      event.preventDefault();
      const deltaX = event.clientX - lastPointerX;
      lastPointerX = event.clientX;
      lightstick.rotation.y += deltaX * 0.004;
    });

    const finishFrontDrag = (event) => {
      if (event.pointerId !== activeFrontPointerId) return;
      activeFrontPointerId = null;
      if (renderer.domElement.hasPointerCapture(event.pointerId)) {
        renderer.domElement.releasePointerCapture(event.pointerId);
      }
    };
    renderer.domElement.addEventListener('pointerup', finishFrontDrag);
    renderer.domElement.addEventListener('pointercancel', finishFrontDrag);

    // ---------- Animation ----------
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);

      const t = clock.getElapsedTime();

      controls.update();

      if (lightOn) {
        crystalMat.emissiveIntensity = 7 + Math.sin(t * 3.2) * 1;
        crystalAuraMat.opacity = 0.95 + Math.sin(t * 2.4) * 0.05;
        crystalLight.intensity = 8 + Math.sin(t * 2.4) * 1;
        const auraSize = 4.1 + Math.sin(t * 2.4) * 0.28;
        crystalAura.scale.set(auraSize, auraSize, 1);
        reflections.forEach((reflection) => {
          const shimmer = 0.55 + Math.sin(t * 2.1 + reflection.userData.phase) * 0.35;
          reflection.material.opacity = reflection.userData.baseOpacity * shimmer;
          const pulse = 0.85 + shimmer * 0.3;
          reflection.scale.setScalar(reflection.userData.baseSize * pulse);
        });
      }

      renderer.render(scene, camera);
    }

    animate();

    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });
  </script>
</body>
</html>
