<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Three.js Lightstick Prototype</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 30%, #f8fbff 0%, #e8edf5 38%, #cfd6e2 100%);
      font-family: Arial, sans-serif;
    }
    body.dark-mode {
      background: radial-gradient(circle at 50% 30%, #242a37 0%, #11151e 48%, #080a10 100%);
    }
    #app {
      width: 100%;
      height: 100%;
    }
    .ui {
      position: fixed;
      left: 18px;
      bottom: 18px;
      z-index: 5;
      padding: 12px 14px;
      border-radius: 14px;
      background: rgba(255,255,255,.72);
      backdrop-filter: blur(12px);
      box-shadow: 0 10px 30px rgba(30,45,70,.12);
      color: #263244;
      font-size: 13px;
      line-height: 1.55;
      user-select: none;
    }
    .ui b { font-size: 14px; }
    .ui button {
      margin-top: 8px;
      padding: 7px 11px;
      border: 0;
      border-radius: 999px;
      background: #222836;
      color: white;
      cursor: pointer;
      font-weight: 700;
    }
    .ui button + button {
      margin-left: 5px;
    }
    body.dark-mode .ui {
      background: rgba(22,27,38,.82);
      color: #e6eaf2;
      box-shadow: 0 10px 30px rgba(0,0,0,.3);
    }
    body.dark-mode .ui button {
      background: #e6eaf2;
      color: #222836;
    }

    .part-panel {
      position: fixed;
      top: 18px;
      right: 18px;
      width: min(250px, calc(100vw - 36px));
      max-height: calc(100vh - 36px);
      overflow: auto;
      z-index: 10;
      padding: 12px;
      border-radius: 10px;
      background: rgba(255,255,255,.8);
      backdrop-filter: blur(12px);
      box-shadow: 0 12px 28px rgba(30,45,70,.12);
      color: #1f2736;
      font-size: 12px;
    }
    body.dark-mode .part-panel {
      background: rgba(24,29,40,.88);
      color: #e6eaf2;
      box-shadow: 0 12px 28px rgba(0,0,0,.35);
    }
    body.dark-mode .part-panel h3 {
      color: #f0f3fa;
    }
    body.dark-mode .part-panel-toggle {
      background: #e6eaf2;
      color: #222836;
    }
    body.dark-mode .part-slot {
      border-bottom-color: rgba(220,230,250,.16);
    }
    body.dark-mode .part-slot select {
      border-color: rgba(220,230,250,.22);
      background: #303747;
      color: #f0f3fa;
    }
    .part-panel.collapsed {
      width: auto;
    }
    .part-panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .part-panel h3 {
      margin: 0;
      font-size: 13px;
      letter-spacing: .04em;
      text-transform: uppercase;
      color: #384159;
    }
    .part-panel-toggle {
      flex: none;
      padding: 5px 9px;
      border: 0;
      border-radius: 999px;
      background: #222836;
      color: white;
      cursor: pointer;
      font: inherit;
      font-weight: 700;
    }
    .part-panel-content {
      margin-top: 12px;
    }
    .spindle-control {
      display: flex;
      align-items: center;
      gap: 7px;
      margin-bottom: 10px;
      font-weight: 700;
      cursor: pointer;
    }
    .spindle-control input {
      margin: 0;
      accent-color: #2d6df6;
    }
    .part-slot {
      margin-bottom: 6px;
      padding: 6px 0;
      border-bottom: 1px solid rgba(40, 52, 70, 0.12);
    }
    .part-slot-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 4px;
      font-weight: 700;
    }
    .part-control-label {
      display: block;
      margin-top: 4px;
    }
    .part-slot select {
      width: 100%;
      margin: 0 0 4px;
      padding: 7px 9px;
      border: 1px solid rgba(30,45,70,.18);
      border-radius: 9px;
      background: white;
      color: #1f2736;
      font-size: 12px;
    }
    .part-slot input[type="range"] {
      width: 100%;
      accent-color: #2d6df6;
      display: block;
    }
    @media (max-width: 600px) {
      .part-panel {
        top: 10px;
        right: 10px;
        width: min(205px, calc(100vw - 20px));
        max-height: calc(100vh - 20px);
        padding: 9px;
        font-size: 11px;
      }
      .part-panel-header {
        gap: 8px;
      }
      .part-panel h3 {
        font-size: 12px;
      }
      .part-panel-toggle {
        padding: 4px 8px;
      }
      .part-panel-content {
        margin-top: 8px;
      }
      .spindle-control {
        margin-bottom: 7px;
      }
      .part-slot {
        margin-bottom: 4px;
        padding: 4px 0;
      }
      .part-slot select {
        padding: 5px 7px;
        font-size: 11px;
      }
      .part-control-label {
        margin-top: 2px;
      }
    }
  </style>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.181.1/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.181.1/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="app"></div>

  <div class="ui">
    드래그: 회전 · 휠: 확대/축소<br/>
    버튼 클릭: 조명 ON/OFF<br/>
    <button id="toggle">LIGHT ON</button>
    <button id="darkModeToggle" type="button" aria-pressed="false">다크모드 OFF</button>
    <button id="chaTransformationReset" type="button" hidden>변신 해제하기</button>
  </div>

  <div class="part-panel" id="partPanel">
    <div class="part-panel-header">
      <h3 id="partPanelTitle">파트 커스터마이저</h3>
      <button class="part-panel-toggle" id="partPanelToggle" type="button" aria-expanded="true" aria-controls="partPanelContent">접기</button>
    </div>
    <div class="part-panel-content" id="partPanelContent">
      <label class="spindle-control"><input id="spindleToggle" type="checkbox" checked /> 중앙 축 표시</label>
    </div>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

    const container = document.getElementById('app');

    const scene = new THREE.Scene();
    scene.background = null;

    const camera = new THREE.PerspectiveCamera(34, innerWidth / innerHeight, 0.1, 100);
    camera.position.set(5.4, 4.1, 8.6);
    camera.lookAt(0, 1.15, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 0.7;
    renderer.localClippingEnabled = true;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    container.appendChild(renderer.domElement);

    const reflectionRandom = (seed) => {
      const value = Math.sin(seed * 127.1 + 311.7) * 43758.5453;
      return value - Math.floor(value);
    };

    const environmentGenerator = new THREE.PMREMGenerator(renderer);
    scene.environment = environmentGenerator.fromScene(new RoomEnvironment(), 0.04).texture;
    environmentGenerator.dispose();

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.target.set(0, 1.0, 0);
    controls.minDistance = 5.2;
    controls.maxDistance = 15;
    controls.maxPolarAngle = Math.PI * 0.82;

    // ---------- Lighting ----------
    const hemisphere = new THREE.HemisphereLight(0xffffff, 0x9ba6b6, 0.7);
    scene.add(hemisphere);

    const key = new THREE.DirectionalLight(0xffffff, 1.2);
    key.position.set(4, 7, 6);
    key.castShadow = true;
    key.shadow.mapSize.set(2048, 2048);
    scene.add(key);

    const rim = new THREE.PointLight(0xcce8ff, 0.45, 20);
    rim.position.set(-4, 5, -2);
    scene.add(rim);

    const warm = new THREE.PointLight(0xffdcc5, 0.4, 14);
    warm.position.set(3, 1, 3);
    scene.add(warm);

    // ---------- Materials ----------
    const whiteMat = new THREE.MeshPhysicalMaterial({
      color: 0xf5f6f8,
      roughness: 0.32,
      metalness: 0.08,
      clearcoat: 0.35,
      clearcoatRoughness: 0.18
    });

    const darkMat = new THREE.MeshStandardMaterial({
      color: 0x24262c,
      roughness: 0.28,
      metalness: 0.65
    });

    const glassMat = new THREE.MeshPhysicalMaterial({
      color: 0xf9fcff,
      transmission: 0.9,
      transparent: true,
      opacity: 0.28,
      roughness: 0.08,
      thickness: 0.45,
      ior: 1.45,
      side: THREE.DoubleSide,
      depthWrite: false
    });

    const creamMat = new THREE.MeshStandardMaterial({
      color: 0xffe9ad,
      roughness: 0.65,
      metalness: 0.0
    });

    const crystalMat = new THREE.MeshPhysicalMaterial({
      color: 0xffffff,
      vertexColors: true,
      transmission: 0.12,
      roughness: 0.08,
      metalness: 0,
      emissive: 0xffffff,
      emissiveIntensity: 0,
      clearcoat: 1,
      clearcoatRoughness: 0.02,
      ior: 2.4,
      reflectivity: 1
    });

    const glowCanvas = document.createElement('canvas');
    glowCanvas.width = 128;
    glowCanvas.height = 128;
    const glowContext = glowCanvas.getContext('2d');
    if (!glowContext) throw new Error('보석 후광 텍스처를 만들 수 없습니다.');
    const glowGradient = glowContext.createRadialGradient(64, 64, 0, 64, 64, 64);
    glowGradient.addColorStop(0, 'rgba(190, 205, 255, 0.22)');
    glowGradient.addColorStop(0.32, 'rgba(160, 180, 255, 0.42)');
    glowGradient.addColorStop(0.65, 'rgba(145, 165, 255, 0.2)');
    glowGradient.addColorStop(1, 'rgba(130, 155, 255, 0)');
    glowContext.fillStyle = glowGradient;
    glowContext.fillRect(0, 0, 128, 128);
    const crystalAuraMat = new THREE.SpriteMaterial({
      map: new THREE.CanvasTexture(glowCanvas),
      color: 0xaebfff,
      transparent: true,
      opacity: 0,
      blending: THREE.AdditiveBlending,
      depthWrite: false
    });
    const reflectionColors = [0xffe7a6, 0xc7efff, 0xffc9e8, 0xffffff];
    const reflections = Array.from({ length: 42 }, (_, index) => {
      const azimuth = reflectionRandom(index + 1) * Math.PI * 2;
      const vertical = reflectionRandom(index + 91) * 2 - 1;
      const horizontal = Math.sqrt(1 - vertical * vertical);
      const radius = 4.2 + reflectionRandom(index + 181) * 5.8;
      const reflection = new THREE.Sprite(new THREE.SpriteMaterial({
        map: crystalAuraMat.map,
        color: reflectionColors[Math.floor(reflectionRandom(index + 271) * reflectionColors.length)],
        transparent: true,
        opacity: 0,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
        toneMapped: false
      }));
      const size = 0.12 + reflectionRandom(index + 541) * 0.22;
      reflection.scale.set(size, size, 1);
      reflection.userData.baseSize = size;
      reflection.position.set(
        Math.cos(azimuth) * horizontal * radius,
        1.7 + vertical * radius * 0.9,
        Math.sin(azimuth) * horizontal * radius
      );
      reflection.userData.phase = reflectionRandom(index + 361) * Math.PI * 2;
      reflection.userData.baseOpacity = 0.55 + reflectionRandom(index + 451) * 0.45;
      scene.add(reflection);
      return reflection;
    });

    // ---------- Helpers ----------
    function mesh(geometry, material, {x=0,y=0,z=0, rx=0,ry=0,rz=0, sx=1,sy=1,sz=1}={}) {
      const m = new THREE.Mesh(geometry, material);
      m.position.set(x,y,z);
      m.rotation.set(rx,ry,rz);
      m.scale.set(sx,sy,sz);
      m.castShadow = true;
      m.receiveShadow = true;
      return m;
    }

    function torus(r, tube, y, scaleY=1, mat=whiteMat) {
      const t = mesh(new THREE.TorusGeometry(r, tube, 18, 64), mat, {y, rx: Math.PI/2});
      t.scale.y = scaleY;
      return t;
    }

    // ---------- Root ----------
    const lightstick = new THREE.Group();
    lightstick.position.y = -1.0;
    scene.add(lightstick);

    // ---------- Handle / Base ----------
    const handle = new THREE.Group();
    lightstick.add(handle);

    // Main lower grip
    handle.add(mesh(new THREE.CylinderGeometry(0.53, 0.42, 2.35, 64), whiteMat, {y:-1.88}));

    // slight upper neck
    handle.add(mesh(new THREE.CylinderGeometry(0.40, 0.48, 0.30, 64), whiteMat, {y:-0.61}));

    // base rim
    handle.add(mesh(new THREE.CylinderGeometry(0.68, 0.58, 0.38, 64), whiteMat, {y:-2.98}));
    handle.add(torus(0.56, 0.055, -2.86));
    handle.add(torus(0.49, 0.035, -1.0));

    // Button bezel + button
    const bezel = mesh(new THREE.CylinderGeometry(0.19, 0.19, 0.07, 40), whiteMat, {y:-2.15, z:0.49, rx:Math.PI/2});
    handle.add(bezel);

    const buttonMat = new THREE.MeshPhysicalMaterial({
      color: 0xf4f6f8,
      roughness: 0.22,
      metalness: 0.05,
      clearcoat: 0.8
    });
    const button = mesh(new THREE.CylinderGeometry(0.135, 0.135, 0.08, 40), buttonMat, {y:-2.15, z:0.535, rx:Math.PI/2});
    button.name = 'button';
    handle.add(button);

    // ---------- Middle transparent chamber ----------
    const chamber = new THREE.Group();
    lightstick.add(chamber);

    // transparent tube
    const chamberGlassMat = glassMat.clone();
    chamberGlassMat.envMapIntensity = 0;
    chamberGlassMat.reflectivity = 0;
    chamberGlassMat.roughness = 1;
    const chamberGlass = mesh(new THREE.CylinderGeometry(0.47,0.47,2.02,64,1,true), chamberGlassMat, {y:0.52});
    chamber.add(chamberGlass);

    // top and bottom trim
    chamber.add(mesh(new THREE.CylinderGeometry(0.53,0.53,0.15,64), whiteMat, {y:-0.53}));
    chamber.add(mesh(new THREE.CylinderGeometry(0.54,0.54,0.15,64), whiteMat, {y:1.57}));

    const partSpindleMat = new THREE.MeshStandardMaterial({
      color: 0x858b95,
      roughness: 0.28,
      metalness: 0.72
    });
    const partSpindle = mesh(new THREE.CylinderGeometry(0.035, 0.035, 2.1, 24), partSpindleMat, {y:0.52});
    chamber.add(partSpindle);

    // ---------- Custom part slots ----------
    const partOptions = [
      { label: '사과', value: 'parts/apple.html' },
      { label: '선아현', value: 'parts/ahyeon.html' },
      { label: '배세진', value: 'parts/bea.html' },
      { label: '차유진', value: 'parts/cha.html' },
      { label: '김래빈', value: 'parts/kim.html' },
      { label: '박문대', value: 'parts/moon.html' },
      { label: '류청우', value: 'parts/ryu.html' },
      { label: '이세진', value: 'parts/sejin.html' },
      { label: '하트', value: 'parts/heart.html' }
    ];

    function applyPartEdits(model, edits = {}) {
      for (const child of model.children) {
        const edit = edits[child.name];
        if (!edit) continue;
        const position = edit.position || [0, 0, 0];
        const rotation = edit.rotation || [0, 0, 0];
        const axisScale = edit.axisScale || [1, 1, 1];
        child.position.add(new THREE.Vector3(...position));
        child.rotation.x += THREE.MathUtils.degToRad(rotation[0] || 0);
        child.rotation.y += THREE.MathUtils.degToRad(rotation[1] || 0);
        child.rotation.z += THREE.MathUtils.degToRad(rotation[2] || 0);
        child.scale.multiplyScalar(edit.size ?? 1);
        child.scale.multiply(new THREE.Vector3(...axisScale));
        child.visible = edit.visible !== false;
        if (edit.color) {
          const materials = Array.isArray(child.material) ? child.material : [child.material];
          materials.forEach((material) => material.color?.set(edit.color));
        }
      }
    }

    function applyFeatherClipping(model, clipping, enabled) {
      if (!clipping) return;
      for (const child of model.children) {
        if (!child.name.startsWith('깃털')) continue;
        const materials = Array.isArray(child.material) ? child.material : [child.material];
        materials.forEach((material) => {
          const state = material.userData.cylinderClip ||= {
            enabled,
            radius: clipping.cylinderRadius,
            rootInverse: new THREE.Matrix4(),
            shader: null
          };
          state.enabled = enabled;
          state.radius = clipping.cylinderRadius;
          if (!state.shader) {
            material.onBeforeCompile = (shader) => {
              shader.uniforms.uCylinderRootInverse = { value: state.rootInverse };
              shader.uniforms.uCylinderClipEnabled = { value: state.enabled };
              shader.uniforms.uCylinderClipRadius = { value: state.radius };
              shader.vertexShader = shader.vertexShader
                .replace('#include <common>', '#include <common>\nuniform mat4 uCylinderRootInverse;\nvarying vec3 vCylinderLocalPosition;')
                .replace('#include <begin_vertex>', '#include <begin_vertex>\nvCylinderLocalPosition = (uCylinderRootInverse * modelMatrix * vec4(transformed, 1.0)).xyz;');
              shader.fragmentShader = shader.fragmentShader
                .replace('#include <common>', '#include <common>\nuniform bool uCylinderClipEnabled;\nuniform float uCylinderClipRadius;\nvarying vec3 vCylinderLocalPosition;')
                .replace('#include <opaque_fragment>', 'if (uCylinderClipEnabled && dot(vCylinderLocalPosition.xz, vCylinderLocalPosition.xz) > uCylinderClipRadius * uCylinderClipRadius) discard;\n#include <opaque_fragment>');
              state.shader = shader;
            };
            material.customProgramCacheKey = () => 'cylinder-edge-clip';
            material.needsUpdate = true;
          }
          if (state.shader) {
            state.shader.uniforms.uCylinderClipEnabled.value = enabled;
            state.shader.uniforms.uCylinderClipRadius.value = clipping.cylinderRadius;
          }
        });
        child.onBeforeRender = () => {
          model.updateWorldMatrix(true, false);
          const rootInverse = model.matrixWorld.clone().invert();
          const materials = Array.isArray(child.material) ? child.material : [child.material];
          materials.forEach((material) => {
            const state = material.userData.cylinderClip;
            if (state) state.rootInverse.copy(rootInverse);
          });
        };
      }
    }

    const slotConfigs = [
      { id: 'top', label: '상단', defaultFile: 'parts/apple.html', y: 0.87, scale: 0.7 },
      { id: 'middle', label: '중간', defaultFile: 'parts/moon.html', y: 0.28, scale: 0.7 },
      { id: 'bottom', label: '하단', defaultFile: 'parts/apple.html', y: -0.32, scale: 0.7 }
    ];
    const ribbonColors = new Map([
      ['ahyeon.html', 0xa777e8],
      ['bea.html', 0x3987ff],
      ['moon.html', 0xff72ad]
    ]);
    const selectedPartFiles = new Map(slotConfigs.map((config) => [config.id, config.defaultFile]));
    const loadedPartModels = new Map();
    const ribbonCombination = [...ribbonColors.keys()];
    const chaColorCombination = ['cha.html', 'kim.html', 'ryu.html'];
    let chaTransformationDismissed = false;
    const chaCombinationColors = new Map([
      ['머리', 0x383b40],
      ['왼쪽 귀', 0x383b40],
      ['오른쪽 귀', 0x383b40],
      ['무늬 왼쪽', 0x383b40],
      ['무늬 가운데', 0x383b40],
      ['무늬 오른쪽', 0x383b40],
      ['왼쪽 눈', 0xf2cf45],
      ['오른쪽 눈', 0xf2cf45],
      ['왼쪽 눈썹', 0xf2cf45],
      ['오른쪽 눈썹', 0xf2cf45]
    ]);

    function updateChaCombinationColors(model, enabled) {
      chaCombinationColors.forEach((color, name) => {
        const component = model.getObjectByName(name);
        if (!component) return;
        component.traverse((object) => {
          if (!object.isMesh) return;
          if (!object.userData.combinationBaseMaterials) {
            const materials = Array.isArray(object.material) ? object.material : [object.material];
            object.userData.combinationMaterialArray = Array.isArray(object.material);
            object.userData.combinationBaseMaterials = materials;
            object.userData.combinationOverrideMaterials = materials.map((material) => material.clone());
          }
          const materials = enabled
            ? object.userData.combinationOverrideMaterials
            : object.userData.combinationBaseMaterials;
          if (enabled) materials.forEach((material) => material.color.set(color));
          object.material = object.userData.combinationMaterialArray ? materials : materials[0];
        });
      });
    }

    function createForeheadRibbon(head, color) {
      const ribbon = new THREE.Group();
      const ribbonMaterial = new THREE.MeshPhysicalMaterial({
        color,
        roughness: 0.28,
        metalness: 0.04,
        clearcoat: 0.8,
        clearcoatRoughness: 0.18,
        side: THREE.DoubleSide
      });
      const loopShape = new THREE.Shape();
      loopShape.moveTo(0, 0);
      loopShape.quadraticCurveTo(-0.05, 0.19, -0.29, 0.22);
      loopShape.quadraticCurveTo(-0.43, 0.16, -0.37, 0);
      loopShape.quadraticCurveTo(-0.43, -0.16, -0.29, -0.22);
      loopShape.quadraticCurveTo(-0.05, -0.19, 0, 0);
      const loopGeometry = new THREE.ExtrudeGeometry(loopShape, {
        depth: 0.055,
        bevelEnabled: true,
        bevelSegments: 5,
        bevelSize: 0.03,
        bevelThickness: 0.04,
        steps: 1,
        curveSegments: 12
      });
      const loopPositions = loopGeometry.attributes.position;
      for (let index = 0; index < loopPositions.count; index += 1) {
        const x = loopPositions.getX(index);
        const y = loopPositions.getY(index);
        const domeRadius = ((x + 0.215) / 0.32) ** 2 + (y / 0.27) ** 2;
        const dome = Math.pow(Math.max(0, 1 - domeRadius), 1.5);
        loopPositions.setZ(index, loopPositions.getZ(index) + 0.18 * dome);
      }
      loopGeometry.computeVertexNormals();
      const leftLoop = new THREE.Mesh(loopGeometry, ribbonMaterial);
      leftLoop.position.z = -0.045;
      ribbon.add(leftLoop);

      const rightLoop = new THREE.Mesh(loopGeometry, ribbonMaterial);
      rightLoop.position.z = -0.045;
      rightLoop.scale.x = -1;
      ribbon.add(rightLoop);

      const knot = new THREE.Mesh(new THREE.SphereGeometry(0.065, 14, 10), ribbonMaterial);
      knot.position.z = 0.045;
      knot.scale.set(1.05, 1.1, 0.85);
      ribbon.add(knot);
      ribbon.scale.setScalar(1.45);
      ribbon.position.set(0, 0.7, 0.64);
      ribbon.rotation.x = -Math.PI / 4;
      ribbon.visible = false;
      head.add(ribbon);
      return ribbon;
    }

    function updateCombinationRibbons() {
      const selectedFiles = [...selectedPartFiles.values()].map((file) => file.split('/').pop());
      const hasRibbonCombination = selectedFiles.length === ribbonCombination.length
        && ribbonCombination.every((file) => selectedFiles.includes(file));
      const hasChaColorCombination = selectedFiles.length === chaColorCombination.length
        && chaColorCombination.every((file) => selectedFiles.includes(file));
      if (!hasChaColorCombination) chaTransformationDismissed = false;
      const isChaTransformationActive = hasChaColorCombination && !chaTransformationDismissed;
      chaTransformationReset.hidden = !isChaTransformationActive;
      loadedPartModels.forEach(({ file, ribbon, model }) => {
        if (ribbon) ribbon.visible = hasRibbonCombination && ribbonCombination.includes(file);
        if (file === 'cha.html') updateChaCombinationColors(model, isChaTransformationActive);
      });
    }

    const partPanel = document.getElementById('partPanel');
    const partPanelToggle = document.getElementById('partPanelToggle');
    const partPanelContent = document.getElementById('partPanelContent');
    const spindleToggle = document.getElementById('spindleToggle');
    const chaTransformationReset = document.getElementById('chaTransformationReset');

    chaTransformationReset.addEventListener('click', () => {
      chaTransformationDismissed = true;
      updateCombinationRibbons();
    });

    spindleToggle.addEventListener('change', () => {
      partSpindle.visible = spindleToggle.checked;
    });

    partPanelToggle.addEventListener('click', () => {
      const isExpanded = partPanelToggle.getAttribute('aria-expanded') === 'true';
      partPanel.classList.toggle('collapsed', isExpanded);
      partPanelContent.hidden = isExpanded;
      partPanelToggle.setAttribute('aria-expanded', String(!isExpanded));
      partPanelToggle.textContent = isExpanded ? '펼치기' : '접기';
    });

    slotConfigs.forEach((config) => {
      const wrapper = document.createElement('div');
      wrapper.className = 'part-slot';

      const header = document.createElement('div');
      header.className = 'part-slot-header';
      header.innerHTML = `<span>${config.label}</span>`;

      const select = document.createElement('select');
      const emptyOption = document.createElement('option');
      emptyOption.value = '';
      emptyOption.textContent = '선택 안 함';
      select.appendChild(emptyOption);
      partOptions.forEach((item) => {
        const option = document.createElement('option');
        option.value = item.value;
        option.textContent = item.label;
        select.appendChild(option);
      });
      select.value = config.defaultFile;

      const positionRange = document.createElement('input');
      positionRange.type = 'range';
      positionRange.min = '-1.5';
      positionRange.max = '1.5';
      positionRange.step = '0.01';
      positionRange.value = '0';
      positionRange.setAttribute('aria-label', `${config.label} 파트 세로 위치`);

      const positionLabel = document.createElement('label');
      positionLabel.className = 'part-control-label';
      positionLabel.textContent = '세로 위치';
      positionLabel.appendChild(positionRange);

      const iframe = document.createElement('iframe');
      iframe.title = `${config.label} 파트`;
      iframe.hidden = true;
      wrapper.appendChild(header);
      wrapper.appendChild(select);
      wrapper.appendChild(positionLabel);
      wrapper.appendChild(iframe);
      partPanelContent.appendChild(wrapper);

      const group = new THREE.Group();
      group.position.set(0, config.y, 0);
      chamber.add(group);
      let inSceneMesh = null;
      const removeCurrentMesh = () => {
        loadedPartModels.delete(config.id);
        if (!inSceneMesh) return;
        group.remove(inSceneMesh);
        inSceneMesh.traverse((object) => {
          object.geometry?.dispose?.();
          const materials = Array.isArray(object.material) ? object.material : [object.material];
          const overrideMaterials = object.userData.combinationOverrideMaterials || [];
          new Set([...materials, ...overrideMaterials]).forEach((material) => material?.dispose?.());
        });
        inSceneMesh = null;
      };
      const receivePartModel = (event) => {
        const currentFile = new URL(iframe.src).pathname.split('/').pop();
        if (event.source !== iframe.contentWindow || event.data?.type !== 'lightstick-part' || event.data.file !== currentFile) return;
        removeCurrentMesh();
        try {
          const model = new THREE.ObjectLoader().parse(event.data.object);
          applyPartEdits(model, event.data.edits);
          model.position.y = 0.18;
          model.scale.setScalar(config.scale * 0.4);
          model.traverse((object) => {
            if (object.isMesh) {
              object.castShadow = true;
              object.receiveShadow = true;
              const materials = Array.isArray(object.material) ? object.material : [object.material];
              const visibleMaterials = materials.map((material) => {
                if (!material) return material;
                if ('roughness' in material) material.roughness = 0.16;
                if (material.isMeshPhysicalMaterial) {
                  material.clearcoat = 1;
                  material.clearcoatRoughness = 0.08;
                  material.transmission = 0;
                }
                material.transparent = false;
                material.opacity = 1;
                return material;
              });
              object.material = Array.isArray(object.material) ? visibleMaterials : visibleMaterials[0];
            }
          });
          applyFeatherClipping(model, event.data.clipping, event.data.edits?.__settings?.clipFeathers === true);
          const ribbonColor = ribbonColors.get(currentFile);
          const head = model.getObjectByName('머리');
          const ribbon = ribbonColor && head ? createForeheadRibbon(head, ribbonColor) : null;
          group.add(model);
          inSceneMesh = model;
          loadedPartModels.set(config.id, { file: currentFile, ribbon, model });
          updateCombinationRibbons();
        } catch (error) {
          console.error(`파트 모델을 불러오지 못했습니다: ${config.label}`, error);
        }
      };
      window.addEventListener('message', receivePartModel);

      select.addEventListener('change', () => {
        removeCurrentMesh();
        selectedPartFiles.set(config.id, select.value);
        updateCombinationRibbons();
        if (!select.value) {
          iframe.src = 'about:blank';
          return;
        }
        iframe.src = select.value;
      });

      positionRange.addEventListener('input', () => {
        group.position.y = config.y + Number(positionRange.value);
      });

      iframe.src = config.defaultFile;
    });

    // ---------- Upper head base ----------
    const headGroup = new THREE.Group();
    headGroup.position.y = 1.92;
    lightstick.add(headGroup);

    headGroup.add(mesh(new THREE.CylinderGeometry(0.58,0.48,0.22,64), whiteMat, {y:-0.36}));
    headGroup.add(torus(0.54,0.055,-0.22));

    // ---------- Crystal ----------
    function createBrilliantCutGeometry() {
      const sides = 8;
      const table = [];
      const crown = [];
      const girdle = [];
      const culet = new THREE.Vector3(0, -0.32, 0);
      for (let index = 0; index < sides; index += 1) {
        const angle = (index / sides) * Math.PI * 2 + Math.PI / sides;
        const cosine = Math.cos(angle);
        const sine = Math.sin(angle);
        table.push(new THREE.Vector3(cosine * 0.18, 0.29, sine * 0.18));
        crown.push(new THREE.Vector3(cosine * 0.31, 0.18, sine * 0.31));
        girdle.push(new THREE.Vector3(cosine * 0.44, 0.04, sine * 0.44));
      }

      const vertices = [];
      const colors = [];
      const addFace = (a, b, c, shade) => {
        const normal = new THREE.Vector3()
          .subVectors(b, a)
          .cross(new THREE.Vector3().subVectors(c, a));
        const center = new THREE.Vector3().add(a).add(b).add(c);
        if (normal.dot(center) < 0) [b, c] = [c, b];
        for (const point of [a, b, c]) {
          vertices.push(point.x, point.y, point.z);
          colors.push(shade, shade, shade);
        }
      };

      const center = new THREE.Vector3(0, 0.29, 0);
      for (let index = 0; index < sides; index += 1) {
        const next = (index + 1) % sides;
        const shade = [0.78, 1, 0.9, 0.84, 0.96, 0.74][index % 6];
        addFace(center, table[index], table[next], 1);
        addFace(table[index], crown[index], crown[next], shade);
        addFace(table[index], crown[next], table[next], shade);
        addFace(crown[index], girdle[index], girdle[next], shade);
        addFace(crown[index], girdle[next], crown[next], shade);
        addFace(girdle[index], culet, girdle[next], shade);
      }

      const geometry = new THREE.BufferGeometry();
      geometry.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
      geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
      geometry.computeVertexNormals();
      return geometry;
    }

    const crystal = mesh(createBrilliantCutGeometry(), crystalMat, {y:0.33, sx:1.35, sy:1.6, sz:1.35});
    crystal.rotation.y = Math.PI/4;
    headGroup.add(crystal);

    crystal.geometry.computeBoundingBox();
    const crystalCenter = crystal.geometry.boundingBox.getCenter(new THREE.Vector3())
      .multiply(crystal.scale)
      .applyEuler(crystal.rotation)
      .add(crystal.position);

    const crystalLight = new THREE.PointLight(0xdde8ff, 0, 6, 2);
    crystalLight.position.copy(crystalCenter);
    headGroup.add(crystalLight);

    const crystalAura = new THREE.Sprite(crystalAuraMat);
    crystalAura.position.copy(crystalCenter).add(new THREE.Vector3(0, 0, 0.03));
    crystalAura.scale.set(4.2, 4.2, 1);
    headGroup.add(crystalAura);

    // ---------- Dark cage ----------
    function createCageStrut(angle) {
      const radius = 0.72;
      const zOff = 0.0;

      const pts = [
        new THREE.Vector3(0.42, -0.18, zOff),
        new THREE.Vector3(0.62,  0.02, zOff),
        new THREE.Vector3(0.64,  0.48, zOff),
        new THREE.Vector3(0.50,  1.16, zOff)
      ];

      const curve = new THREE.CatmullRomCurve3(pts);
      const strut = new THREE.Mesh(
        new THREE.TubeGeometry(curve, 40, 0.055, 10, false),
        darkMat
      );
      strut.rotation.y = angle;
      strut.castShadow = true;
      return strut;
    }

    headGroup.add(createCageStrut(0));
    headGroup.add(createCageStrut(Math.PI));
    headGroup.add(createCageStrut(Math.PI/2));
    headGroup.add(createCageStrut(-Math.PI/2));

    // top and bottom cage bars
    headGroup.add(mesh(new THREE.CylinderGeometry(0.69,0.69,0.09,64), darkMat, {y:1.18}));
    headGroup.add(mesh(new THREE.CylinderGeometry(0.63,0.63,0.09,64), darkMat, {y:-0.12}));

    // center vertical bar, like reference silhouette
    headGroup.add(mesh(new THREE.CylinderGeometry(0.04,0.04,1.35,16), darkMat, {y:0.48}));

    // tiny top cap
    headGroup.add(mesh(new THREE.SphereGeometry(0.11,24,18), darkMat, {y:1.37}));
    headGroup.add(mesh(new THREE.CylinderGeometry(0.055,0.055,0.18,12), darkMat, {y:1.31}));

    // ---------- Outer glass dome ----------
    // Lathe profile produces a lantern-like rounded dome
    const domeProfile = [
      new THREE.Vector2(0.43, -0.30),
      new THREE.Vector2(0.60, -0.08),
      new THREE.Vector2(0.77,  0.38),
      new THREE.Vector2(0.75,  0.90),
      new THREE.Vector2(0.64,  1.42),
      new THREE.Vector2(0.46,  1.72),
      new THREE.Vector2(0.27,  1.82),
      new THREE.Vector2(0.00,  1.82)
    ];
    const dome = mesh(new THREE.LatheGeometry(domeProfile, 72), glassMat, {y:-0.10});
    dome.scale.set(1.14, 1.00, 1.08);
    headGroup.add(dome);

    // ---------- Floor ----------
    const floorMaterial = new THREE.MeshStandardMaterial({color:0xffffff, roughness:0.95, metalness:0.0});
    const floor = new THREE.Mesh(new THREE.CircleGeometry(5.5, 96), floorMaterial);
    floor.rotation.x = -Math.PI/2;
    floor.position.y = -4.02;
    floor.receiveShadow = true;
    scene.add(floor);

    const floorGlow = new THREE.Mesh(
      new THREE.PlaneGeometry(5.2, 5.2),
      new THREE.MeshBasicMaterial({
        map: crystalAuraMat.map,
        color: 0xb9c8ff,
        transparent: true,
        opacity: 0,
        blending: THREE.AdditiveBlending,
        depthWrite: false,
        toneMapped: false
      })
    );
    floorGlow.rotation.x = -Math.PI / 2;
    floorGlow.position.y = floor.position.y + 0.015;
    scene.add(floorGlow);

    // ---------- Interaction ----------
    let lightOn = false;
    let darkModeOn = false;

    function setLightState(on) {
      lightOn = on;
      document.getElementById('toggle').textContent = on ? 'LIGHT OFF' : 'LIGHT ON';

      crystalMat.emissiveIntensity = on ? 8 : 0;
      crystalAuraMat.opacity = on ? 1 : 0;
      crystalLight.intensity = on ? 9 : 0;
      floorGlow.material.opacity = on ? 0.72 : 0;
      reflections.forEach((reflection) => {
        reflection.material.opacity = on ? reflection.userData.baseOpacity : 0;
      });
    }

    document.getElementById('toggle').addEventListener('click', () => setLightState(!lightOn));
    const darkModeToggle = document.getElementById('darkModeToggle');
    darkModeToggle.addEventListener('click', () => {
      darkModeOn = !darkModeOn;
      document.body.classList.toggle('dark-mode', darkModeOn);
      darkModeToggle.textContent = darkModeOn ? '다크모드 ON' : '다크모드 OFF';
      darkModeToggle.setAttribute('aria-pressed', String(darkModeOn));

      hemisphere.intensity = darkModeOn ? 0.2 : 0.7;
      key.intensity = darkModeOn ? 0.32 : 1.2;
      rim.intensity = darkModeOn ? 0.2 : 0.45;
      warm.intensity = darkModeOn ? 0.16 : 0.4;
      floorMaterial.color.set(darkModeOn ? 0x252a36 : 0xffffff);
    });

    const raycaster = new THREE.Raycaster();
    const pointer = new THREE.Vector2();

    renderer.domElement.addEventListener('pointerdown', (event) => {
      const rect = renderer.domElement.getBoundingClientRect();
      pointer.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
      pointer.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
      raycaster.setFromCamera(pointer, camera);
      const hits = raycaster.intersectObject(button, true);
      if (hits.length) setLightState(!lightOn);
    });

    // ---------- Animation ----------
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);

      const t = clock.getElapsedTime();

      controls.update();

      // subtle showroom motion
      lightstick.rotation.y += 0.0012;
      crystal.rotation.y = Math.PI/4 + Math.sin(t * 0.55) * 0.10;

      if (lightOn) {
        crystalMat.emissiveIntensity = 7 + Math.sin(t * 3.2) * 1;
        crystalAuraMat.opacity = 0.95 + Math.sin(t * 2.4) * 0.05;
        crystalLight.intensity = 8 + Math.sin(t * 2.4) * 1;
        floorGlow.material.opacity = 0.65 + Math.sin(t * 2.4) * 0.08;
        const auraSize = 4.1 + Math.sin(t * 2.4) * 0.28;
        crystalAura.scale.set(auraSize, auraSize, 1);
        reflections.forEach((reflection) => {
          const shimmer = 0.55 + Math.sin(t * 2.1 + reflection.userData.phase) * 0.35;
          reflection.material.opacity = reflection.userData.baseOpacity * shimmer;
          const pulse = 0.85 + shimmer * 0.3;
          reflection.scale.setScalar(reflection.userData.baseSize * pulse);
        });
      }

      renderer.render(scene, camera);
    }

    animate();

    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });
  </script>
</body>
</html>
