<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>러뷰어 먹여살리기</title>
  <link rel="stylesheet" href="style.css">
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.181.1/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.181.1/examples/jsm/"
    }
  }
  </script>
  <script type="module" src="script.js"></script>
</head>
<body>
  <video id="cameraFeed" autoplay playsinline muted></video>
  <div class="background-image-layer" id="backgroundImageLayer" aria-hidden="true"></div>
  <div id="app"></div>
  <div id="screenImageBackLayer" aria-label="응원봉 뒤 이미지"></div>
  <div id="screenImageFrontLayer" aria-label="응원봉 앞 이미지"></div>
  <div class="camera-height-controls" id="cameraHeightControls" aria-label="시점과 위치 이동">
    <button type="button" data-axis="y" data-direction="1" aria-label="카메라 시점 올리기" title="시점 올리기">▲</button>
    <button type="button" data-axis="x" data-direction="-1" aria-label="카메라 시점 왼쪽" title="시점 왼쪽">◀</button>
    <button type="button" data-axis="x" data-direction="1" aria-label="카메라 시점 오른쪽" title="시점 오른쪽">▶</button>
    <button type="button" data-axis="y" data-direction="-1" aria-label="카메라 시점 내리기" title="시점 내리기">▼</button>
  </div>
  <div class="capture-frame">
    <img class="desktop-overlay desktop-left-top" src="img/desktop-left-top.png" alt="" />
    <img class="desktop-overlay desktop-left-bottom" src="img/desktop-left-bottom.png" alt="" />
    <img class="desktop-overlay desktop-middle-bottom" src="img/desktop-middle-bottom.png" alt="" />
    <img class="desktop-overlay desktop-right-top" src="img/desktop-right-top.png" alt="" />
    <img class="desktop-overlay desktop-right-bottom" src="img/desktop-right-bottom.png" alt="" />
    <img class="phone-frame phone-top" src="img/phone-top.png" alt="" />
    <div class="phone-bottom-frame">
      <img class="phone-frame phone-bottom" src="img/phone-bottom.png" alt="" />
      <button id="phoneCaptureButton" type="button" aria-label="폰 버튼을 눌러 화면 캡처" title="화면 캡처"></button>
    </div>
  </div>

  <button class="menu-toggle" id="menuToggle" type="button" aria-expanded="false" aria-controls="controlMenu" aria-label="조작 메뉴 열기" title="조작 메뉴">
    <span></span><span></span><span></span>
  </button>
  <div class="ui" id="controlMenu" hidden>
    <div class="menu-heading">
      <div><span class="eyebrow">CONTROL PANEL</span><strong>조작 메뉴</strong></div>
    </div>
    <button id="openCustomizer" type="button" hidden>커스터마이저 열기</button>
    <p class="view-hint" id="viewHint">드래그: 회전 · 휠: 확대/축소</p>
    <section class="control-section">
      <span class="section-label">LIGHTING</span>
      <div class="lighting-controls">
        <button id="toggle" type="button">LIGHT ON</button>
        <label class="light-color-control" for="lightColorInput">라이트 색상
          <input id="lightColorInput" type="color" value="#ffffff" aria-label="라이트 색상 선택" />
        </label>
      </div>
    </section>
    <section class="control-section">
      <span class="section-label">DISPLAY</span>
      <button id="darkModeToggle" type="button" aria-pressed="false">다크모드 OFF</button>
      <div class="view-controls">
        <button id="resetView" type="button">시점 초기화</button>
        <button id="frontModeToggle" type="button" aria-pressed="false">정면 조작 OFF</button>
        <button id="cameraToggle" type="button" aria-pressed="false">카메라 켜기</button>
        <button id="cameraFacingToggle" type="button" hidden>전면으로 전환</button>
        <button id="captureModeToggle" type="button">캡처 모드</button>
      </div>
    </section>
    <section class="control-section">
      <span class="section-label">DECO</span>
      <div class="view-controls">
        <button id="addScreenImage" type="button">이미지 추가</button>
        <button id="backgroundImageToggle" type="button">백그라운드 이미지 추가</button>
      </div>
    </section>
    <input id="screenImageInput" type="file" accept="image/*" multiple hidden />
    <input id="backgroundImageInput" type="file" accept="image/*" hidden />
  </div>
  <div id="captureControls" hidden>
    <button id="frameToggle" type="button" aria-pressed="true">프레임 ON</button>
    <button id="exitCaptureMode" type="button">모드 OFF</button>
    <button id="takeCapture" type="button">화면 캡쳐</button>
  </div>
  <div class="screen-image-controls" id="screenImageControls" hidden aria-label="선택한 이미지 조절">
    <button type="button" data-image-action="scale-down" data-image-edit-control aria-label="이미지 축소" title="축소">−</button>
    <button type="button" data-image-action="scale-up" data-image-edit-control aria-label="이미지 확대" title="확대">+</button>
    <button type="button" data-image-action="rotate-left" data-image-edit-control aria-label="이미지 왼쪽 회전" title="왼쪽 회전">↶</button>
    <button type="button" data-image-action="rotate-right" data-image-edit-control aria-label="이미지 오른쪽 회전" title="오른쪽 회전">↷</button>
    <button type="button" id="screenImageLayerToggle" data-image-action="toggle-layer" data-image-edit-control>뒤로 보내기</button>
    <button type="button" data-image-action="remove" data-image-edit-control aria-label="이미지 삭제" title="삭제">삭제</button>
    <button type="button" id="screenImageLockToggle" data-image-action="toggle-lock" aria-label="이미지 잠금">잠금</button>
  </div>
  <div class="part-panel" id="partPanel">
    <div class="part-panel-header">
      <h3 id="partPanelTitle">커스터마이저</h3>
      <div class="part-panel-actions">
        <button class="part-panel-toggle" id="partPanelToggle" type="button" aria-label="커스터마이저 접기" title="접기" aria-expanded="true" aria-controls="partPanelContent">-</button>
        <button class="part-panel-close" id="partPanelClose" type="button" aria-label="커스터마이저 닫기" title="닫기">×</button>
      </div>
    </div>
    <div class="part-panel-content" id="partPanelContent">
      <div class="part-options-row">
        <label class="spindle-control"><input id="spindleToggle" type="checkbox" checked /> 중앙 축 표시</label>
        <label class="event-control" id="combinationTransformationControl" hidden>
          <input id="combinationTransformationToggle" type="checkbox" checked />
          <span>이벤트 ON</span>
        </label>
      </div>
    </div>
  </div>
  <script>
    (() => {
      const toggle = document.getElementById('menuToggle');
      const menu = document.getElementById('controlMenu');
      let closeTimer;
      const setMenu = (open) => {
        window.clearTimeout(closeTimer);
        if (open) {
          menu.hidden = false;
          requestAnimationFrame(() => menu.classList.add('is-open'));
        } else {
          menu.classList.remove('is-open');
          closeTimer = window.setTimeout(() => { menu.hidden = true; }, 220);
        }
        toggle.setAttribute('aria-expanded', String(open));
        toggle.setAttribute('aria-label', open ? '조작 메뉴 닫기' : '조작 메뉴 열기');
      };
      toggle.addEventListener('click', () => setMenu(menu.hidden || !menu.classList.contains('is-open')));
      document.addEventListener('keydown', (event) => {
        if (event.key === 'Escape' && !menu.hidden) setMenu(false);
      });
      document.addEventListener('pointerdown', (event) => {
        if (!menu.hidden && !menu.contains(event.target) && !toggle.contains(event.target)) setMenu(false);
      });
      const partPanel = document.getElementById('partPanel');
      const partToggle = document.getElementById('partPanelToggle');
      const partContent = document.getElementById('partPanelContent');
      const partClose = document.getElementById('partPanelClose');
      const partHeader = partPanel.querySelector('.part-panel-header');
      const openCustomizer = document.getElementById('openCustomizer');
      let hasShownCustomizerAlert = false;
      const closeCustomizer = () => {
        partPanel.hidden = true;
        openCustomizer.hidden = false;
        if (!hasShownCustomizerAlert) {
          alert('커스터마이저를 닫았습니다. 좌측 상단 메뉴에서 다시 열 수 있어요.');
          hasShownCustomizerAlert = true;
        }
      };
      partClose.addEventListener('click', closeCustomizer);
      openCustomizer.addEventListener('click', () => {
        partPanel.hidden = false;
        openCustomizer.hidden = true;
        setMenu(false);
      });
      let panelDrag = null;
      const keepPartPanelOnScreen = () => {
        const maxLeft = Math.max(8, window.innerWidth - partPanel.offsetWidth - 8);
        const maxTop = Math.max(8, window.innerHeight - partPanel.offsetHeight - 8);
        const left = Number.parseFloat(partPanel.style.left) || partPanel.getBoundingClientRect().left;
        const top = Number.parseFloat(partPanel.style.top) || partPanel.getBoundingClientRect().top;
        partPanel.style.left = `${Math.min(maxLeft, Math.max(8, left))}px`;
        partPanel.style.top = `${Math.min(maxTop, Math.max(8, top))}px`;
        partPanel.style.right = 'auto';
      };
      partHeader.addEventListener('pointerdown', (event) => {
        if (event.target.closest('button') || event.button !== 0) return;
        const bounds = partPanel.getBoundingClientRect();
        partPanel.style.left = `${bounds.left}px`;
        partPanel.style.top = `${bounds.top}px`;
        partPanel.style.right = 'auto';
        panelDrag = {
          pointerId: event.pointerId,
          offsetX: event.clientX - bounds.left,
          offsetY: event.clientY - bounds.top
        };
        partHeader.setPointerCapture(event.pointerId);
        event.preventDefault();
      });
      partHeader.addEventListener('pointermove', (event) => {
        if (!panelDrag || event.pointerId !== panelDrag.pointerId) return;
        partPanel.style.left = `${event.clientX - panelDrag.offsetX}px`;
        partPanel.style.top = `${event.clientY - panelDrag.offsetY}px`;
        keepPartPanelOnScreen();
      });
      const finishPanelDrag = (event) => {
        if (panelDrag?.pointerId === event.pointerId) panelDrag = null;
      };
      partHeader.addEventListener('pointerup', finishPanelDrag);
      partHeader.addEventListener('pointercancel', finishPanelDrag);
      window.addEventListener('resize', () => {
        if (partPanel.style.left) keepPartPanelOnScreen();
      });
      if (partToggle && partPanel && partContent) {
        const syncPartToggle = () => {
          const collapsed = partPanel.classList.contains('collapsed');
          partToggle.textContent = collapsed ? '+' : '-';
          partToggle.setAttribute('aria-label', collapsed ? '커스터마이저 펼치기' : '커스터마이저 접기');
          partToggle.title = collapsed ? '펼치기' : '접기';
          partToggle.setAttribute('aria-expanded', String(!collapsed));
        };
        partToggle.addEventListener('click', () => requestAnimationFrame(syncPartToggle));
        syncPartToggle();
      }
    })();
  </script>
</body>
</html>
